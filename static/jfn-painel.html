<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Central de Inteligência — Controle Externo · RJ</title>
<link rel="stylesheet" href="/static/css/painel.css?v=25e91645">
</head>
<body>
<div id="portal" hidden><video id="pvid" autoplay muted loop playsinline preload="auto" aria-hidden="true"
    poster="/static/assets/portal-hero.jpg"><source src="/static/assets/portal-hero.mp4" type="video/mp4"></video>
  <canvas id="pcv" aria-hidden="true"></canvas><canvas id="pmap" aria-hidden="true"></canvas>
  <div class="pui">
    <div class="pln l1">Reator — online</div>
    <div class="pln l2">Cada real tem um rastro.</div>
    <div class="pln l3">Esta é a vigília que o segue.</div>
    <div class="pskip">toque para entrar</div>
  </div>
</div>
<div id="hologrid" aria-hidden="true"></div>
<canvas id="rjbg" aria-hidden="true"></canvas>
<div id="esfnebula" aria-hidden="true"></div>
<canvas id="netbg" aria-hidden="true"></canvas>
<div class="aura a1" aria-hidden="true"></div><div class="aura a2" aria-hidden="true"></div>
<div id="aurora" aria-hidden="true"></div>
<span class="cometa c1" aria-hidden="true"></span><span class="cometa c2" aria-hidden="true"></span>
<div class="wrap">
  <header>
    <div class="htop">
      <div class="brand"><span class="lg">CE</span><div>Controle Externo<small id="hsub">CENTRAL DE INTELIGÊNCIA · RJ</small></div></div>
      <span class="live" id="livebadge" onclick="hfToggle()" style="cursor:pointer" title="canal de eventos ao vivo — clique para o holofeed"><span class="pulse"></span><span id="livetxt">ao vivo</span></span>
      <span class="actions">
        <span id="kyber" onclick="hfToggle()" title="Kyber core — carga da VM · clique para o holofeed">
          <svg viewBox="0 0 30 30"><circle class="kseg" cx="15" cy="15" r="14"/>
          <circle class="ktrk" cx="15" cy="15" r="11.5"/>
          <circle class="karc" id="karc" cx="15" cy="15" r="11.5" stroke-dasharray="72.3" stroke-dashoffset="72.3"/>
          <circle class="knuc" cx="15" cy="15" r="3.2"/></svg>
        </span>
        <a class="help" onclick="glossario()">Termos</a><a class="ctrl" href="/controle">Controle</a><a class="sair" href="/logout_jfn">Sair</a></span>
    </div>
    <div id="conduit" aria-hidden="true"><span class="cblade"></span></div>
    <div class="spheres" id="spheres"></div>
  </header>
  <main id="view"><div class="skel"><span class="sp"></span>Carregando inteligência…</div></main>
  <nav class="tabs" id="tabs"></nav>
</div>
<div class="ov" id="ov" onclick="if(event.target===this)fecharDossie()"><div class="sheet" id="sheet"></div></div>
<div id="holofeed" role="log" aria-label="eventos do sistema ao vivo">
  <div class="hf-t"><b>◈</b> holofeed <span id="hfload" style="margin-left:auto;color:var(--leg)"></span></div>
  <ul id="hflist"></ul><div class="hf-vazio" id="hfvazio">Silêncio honesto — sem eventos novos; a lâmina respira.</div>
</div>

<script src="/static/assets/jfn-icones.js"></script>
<!-- funções mestras derivadas de capabilities.yaml (fonte única) — precisa vir ANTES de painel.js,
     que consome `CAPS_MESTRAS`. Sem type=module e sem defer, pelo mesmo motivo do painel.js:
     mudar escopo/timing é o vetor que já matou este boot três vezes. -->
<script src="/static/js/caps.js"></script>
<script src="/static/js/painel.js?v=66af4ca4"></script>
</body>
</html>
