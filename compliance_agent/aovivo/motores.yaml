# Catálogo dos motores do "AO VIVO" (painel v61). Fonte única do que aparece na tela.
#
#   id        chave estável (vai no JSON e no CSS)
#   nome      nome humano
#   classe    motor = trabalho de coleta/análise (conta na velocidade do reator) · infra = serviço de apoio
#   descricao uma linha: o que faz
#   unidade   unit systemd --user (sem .service); o .timer de mesmo nome, se existir, dá a próxima execução
#   trava     arquivo de lock: preso (em /proc/locks) = rodando agora, mesmo sem unit (jobs de cron)
#   log       arquivo de log; SÓ as linhas que casam uma regex de `eventos` viram evento
#   eventos   lista branca: regex → texto humano com {1},{2}… (os grupos). `progresso: [a, b]` = grupos
#             numerador/denominador; `tipo` = estado|progresso|dado|achado|falha (padrão: progresso)
#   contador  {db, tabela, rotulo}: MAX(rowid) da tabela; o salto entre leituras vira evento "+N"
#   efeito    (opcional) onde o trabalho APARECE + `horas`: sem avanço nessa janela → efeito.parado
#             (🟡 "rodando sem efeito"). Uma de: {db, tabela, coluna} (MAX de coluna de data; só
#             tabela pequena ou coluna indexada) · {arquivo} (mtime) · {log, regex} (hora em que o
#             1º grupo MUDOU de valor). Não medível = None, nunca "parado".
#
# NUNCA se transmite linha bruta de log: o que não casa a lista branca é ignorado, e o que casa
# ainda passa pelo saneamento (`saneamento.py`).
motores:
  # 13/11/2026 (dono): TFE desligado — `tfe`/`tfe-ob`/`warp` saíram do catálogo. TFE recusa IP de datacenter
  # (Oracle, WARP, GitHub, proxy Google, Tor); a despesa vem dos painéis da CGE (`dados-abertos-rj`) e a OB
  # do SIAFE direto (`siafe-ob`). Unidades systemd preservadas, só desabilitadas (reversível).
  - id: sei-noturno
    nome: SEI noturno
    classe: motor
    descricao: Varre processos SEI nas janelas ociosas (22h–5h), recaptura documentos sem texto
    unidade: jfn-sei-noturno
    log: data/sei_sweep.log
    eventos:
      - regex: '\[recap (\d+)/(\d+)\] SEI-[\d/]+: (\d+) → (\d+) docs com texto'
        texto: 'recaptura {1}/{2}: processo com {4} documentos lidos'
        progresso: [1, 2]
      - regex: '\[recap\] fim do slot — \+(\d+) documentos com texto'
        texto: 'fim do slot: +{1} documentos com texto'
        tipo: dado
  - id: sei-integras
    nome: SEI · íntegras
    classe: motor
    descricao: Drena a fila de íntegras SEI (baixa e arquiva processos)
    unidade: jfn-integra-fila
    # laudo 13/11/2026: 255 "ok" em 7 dias, 48 de 48 com captura vazia — o painel mostrava "agendado".
    # Efeito = último "proc: ok"; antes da correção de 13/11 08:04 o "ok" valia para captura vazia (`desde`).
    efeito: {log: data/sei_integra_fila.log, regex: '^\[[^\]]+\]\s+\S+: ok\s*$', desde: '2026-11-13 08:05:00', horas: 48}
  - id: sei-varredura
    nome: SEI · varredura
    classe: motor
    descricao: Varredura periódica de processos SEI (cron)
    trava: /tmp/varredura_sei.lock
    # 11/11/2026: girava a cada 10 min com `resumo: {}` e aparecia saudável
    efeito: {db: compliance.db, tabela: sei_leitura_dupla, coluna: lido_em, horas: 24}
  - id: dados-abertos-rj
    nome: Dados Abertos RJ · orçamento
    classe: motor
    descricao: TFE Despesa/Receita (portal de dados abertos) + painéis da CGE (execução mensal e NE por credor, SIAFE) → trajetória das finanças
    trava: /tmp/dadosabertos_rj.lock
    log: data/dadosabertos_rj.log
    eventos:
      - regex: '"baixados": (\d+), "inalterados": (\d+)'
        texto: '{1} arquivo(s) novo(s) no portal, {2} sem mudança'
        tipo: dado
      - regex: '"painel": "([a-z0-9-]+)", "tabela": "\w+", "linhas": (\d+)'
        texto: 'painel CGE {1}: {2} linhas'
        tipo: dado
    contador: {db: dadosabertos_rj.db, tabela: da_recurso, rotulo: arquivos do portal}
  - id: siafe-ob
    nome: SIAFE · OBs
    classe: motor
    descricao: Ordens bancárias do SIAFE (a fonte de pagamento da casa)
    contador: {db: compliance.db, tabela: ob_orcamentaria_siafe, rotulo: OBs do SIAFE}
    # laudo 13/11/2026: 51 h sem OB (MFA não respondido) e o painel dizia "ocioso". O runner grava
    # `ultimo_efeito_iso` só com OB ingerida (`ultimo_ok_iso` é o teto enquanto o campo novo não existe).
    efeito: {json: data/sei_cache/siafe_runner_ultimo.json, chave: [ultimo_efeito_iso, ultimo_ok_iso], horas: 30}
  - id: intel-cache
    nome: Inteligência · cache
    classe: motor
    descricao: Materializa os cruzamentos de inteligência e a esfera oficial dos entes do PNCP
    unidade: jfn-intel-cache
  - id: nucleo
    nome: Núcleo · ciclo
    classe: motor
    descricao: Ciclo de inteligência progressiva (perícia, aprendizado, autoaprimoramento)
    unidade: jfn-nucleo-ciclo
  - id: bombeiros
    nome: Bombeiros · perícia
    classe: motor
    descricao: Perícia paralela dos contratos do FUNESBOM
    unidade: jfn-bombeiros-supervisor
    log: data/bombeiros_supervisor.log
    # 11/11/2026: LACUNA parada em 9.458–9.459 de 01/11 a 11/11 com todos os passos rc=0
    efeito: {log: data/bombeiros_integra.log, regex: 'LACUNA: (\d+) processos sem íntegra', sentido: desce, horas: 48}
    eventos:
      - regex: '\] (arquivar|lex|achar_edital|reconcilia|integra|pericia) rc=(\d+)'
        texto: 'passo {1} terminou (código {2})'
  - id: territorio
    nome: Território
    classe: motor
    descricao: Atribui contratos do Estado ao município e da Prefeitura do Rio à AP
    unidade: jfn-territorio
    trava: data/territorio.lock
  - id: pncp
    nome: PNCP · resultados
    classe: motor
    descricao: Coleta os resultados estruturados do PNCP (vencedor homologado por item)
    unidade: jfn-pncp-resultados
    contador: {db: compliance.db, tabela: pncp_resultado, rotulo: resultados do PNCP}
  - id: doerj
    nome: DOERJ
    classe: motor
    descricao: Atos do Diário Oficial do Estado na base
    contador: {db: compliance.db, tabela: publicacoes_doerj, rotulo: atos do DOERJ}
  - id: atas
    nome: Atas de julgamento
    classe: motor
    descricao: Varredura de atas de julgamento de licitações (cron)
    trava: /tmp/sweep_atas_julgamento.lock
    log: data/sweep_atas.log          # o mtime do log dá a hora REAL do "terminou" (job de cron sem systemd)
    # laudo 13/11/2026: 108 de 116 rodadas com 0 atas e o painel dizia "ocioso". Efeito = ata gravada.
    efeito: {db: compliance.db, tabela: ata_documento, coluna: coletado_em, horas: 168}
  - id: pcrj-intel
    nome: PCRJ · inteligência
    classe: motor
    descricao: Refresh da inteligência da Prefeitura do Rio (servidor-fantasma, comissionados × candidatos)
    unidade: jfn-pcrj-intel
  - id: fiscalizacao
    nome: Fiscalização · refresh
    classe: motor
    descricao: Refresh semanal da fiscalização (emendas, PIX, favorecidos, PNCP municipal)
    unidade: jfn-fisc-refresh
  - id: sancoes
    nome: Sanções CEIS/CNEP
    classe: motor
    descricao: Refresh semanal das sanções federais
    unidade: jfn-sancoes
  - id: ronda
    nome: Ronda
    classe: motor
    descricao: Checa o serviço e os alertas; avisa quando há alerta novo
    unidade: jfn-ronda
    log: data/ronda.log
    contador: {db: compliance.db, tabela: alertas, rotulo: alertas de compliance, tipo: achado}
    eventos:
      - regex: 'serviço=(\w+) api=(\w+) alertas=(\d+) eventos=(\d+)'
        texto: 'ronda: serviço {1}, API {2}, {3} alertas na base'
        tipo: estado
  # 13/11/2026 (dono): "o claude vai ser o CO-MOTOR de tudo". O Claude Code pela assinatura julga ao lado da
  # cascata (perícia, parecer, triagem dos alertas, camada subjetiva). Rodando = trava do único `claude` presa.
  # `uso: claude_motor` põe no JSON do motor: chamadas hoje, por tarefa, tetos, último erro e o canário.
  - id: claude
    nome: Claude · co-motor
    classe: motor
    descricao: Claude (assinatura) julga ao lado da cascata gratuita; os vereditos se cruzam e treinam os outros
    trava: data/claude_motor.lock
    log: data/claude_motor.log
    uso: claude_motor
    efeito: {json: data/claude_motor_estado.json, chave: ultima_ok_iso, horas: 30}
    eventos:
      - regex: 'tarefa=(\w+) ok modelo=(\S+) ([\d.]+)s'
        texto: '{1}: respondeu ({2}, {3} s)'
        tipo: dado
      - regex: 'tarefa=(\w+) erro (\w+):'
        texto: '{1}: falhou ({2}) — a cascata respondeu sozinha'
        tipo: falha
      - regex: 'canário (OK|FALHOU)'
        texto: 'canário da assinatura: {1}'
        tipo: estado
      - regex: 'limite de uso: motor em pausa por (\d+) s'
        texto: 'limite de uso da assinatura: pausa de {1} s'
        tipo: falha
  - id: digest
    nome: Digest diário
    classe: motor
    descricao: Resumo diário enviado ao Yoda
    unidade: jfn-digest-diario
  - id: metacognicao
    nome: Hermes · metacognição
    classe: motor
    descricao: Reflexão e automelhoria do Hermes
    unidade: jfn-metacognicao
  - id: arquivo
    nome: Arquivo · cache
    classe: motor
    descricao: Arquiva o cache de processos SEI (cron)
    trava: /tmp/arquivar_cache.lock
  - id: prewarm
    nome: Pré-aquecimento do painel
    classe: infra
    descricao: Aquece o cache das rotas do painel (cron)
    trava: /tmp/prewarm_painel.lock
  - id: painel
    nome: API do painel
    classe: infra
    descricao: O servidor do painel e do Yoda (porta 8000)
    unidade: jfn
  - id: chrome
    nome: Chrome · ponte CDP
    classe: infra
    descricao: Navegador sem tela usado nas coletas TFE/SIAFE
    unidade: chrome-jfn
  - id: tunel
    nome: Túnel do painel
    classe: infra
    descricao: Túnel de acesso externo ao painel
    unidade: painel-tunnel
  - id: hermes
    nome: Hermes · gateway
    classe: infra
    descricao: Gateway de mensagens do Hermes
    unidade: hermes-gateway
  - id: wal
    nome: WAL keeper
    classe: infra
    descricao: Segura o WAL do compliance.db (proteção contra corrupção)
    unidade: jfn-wal-keeper
  - id: massare
    nome: Massare (VM2)
    classe: motor
    descricao: Agente de mercado (fora desta VM); só aparece vivo se houver endpoint de status configurado
    sonda_env: JFN_MASSARE_STATUS_URL
