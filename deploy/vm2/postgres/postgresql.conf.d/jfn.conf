# JFN — PostgreSQL 16 da plataforma de evidências na VM-2 (docs/PLANO-PLATAFORMA-EVIDENCIAS.md, Fase 3).
# Instalado por deploy/vm2/postgres/instalar.sh em /etc/postgresql/16/main/conf.d/jfn.conf (o postgresql.conf do
# Ubuntu já tem `include_dir = 'conf.d'`). Máquina: Oracle A1, 2 vCPU, 11 GB de RAM, SEM swap — dividida com a
# captura SEI, o OCR de reserva e as entregas; por isso o banco fica com ~1/10 da RAM fixa e o resto é do cache do SO.

# ── rede: só loopback e o IP do Tailscale da VM-2 (o pg_hba restringe à Tailnet 100.64.0.0/10) ─────────────────
# Se o tailscale0 subir depois do PostgreSQL no boot, o bind no 100.74.228.51 falharia; o instalar.sh liga
# net.ipv4.ip_nonlocal_bind=1 para isso (o PostgreSQL escuta assim que o IP aparecer).
listen_addresses = '127.0.0.1,100.74.228.51'
port = 5432
max_connections = 40                 # workers de fila + painel/API; cada conexão custa ~10 MB fora do work_mem
password_encryption = scram-sha-256

# ── memória (11 GB, sem swap: estourar = OOM killer, não lentidão) ────────────────────────────────────────────
shared_buffers = 1GB
effective_cache_size = 4GB           # estimativa para o planejador; não aloca nada
work_mem = 16MB                      # por nó de ordenação/hash × conexões: 40 × 16 MB no pior caso ≈ 640 MB
maintenance_work_mem = 256MB
huge_pages = try

# ── CPU (2 vCPU dividida) ──────────────────────────────────────────────────────────────────────────────────────
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1

# ── disco (bloco da Oracle, SSD em rede) ──────────────────────────────────────────────────────────────────────
random_page_cost = 1.1
effective_io_concurrency = 100

# ── WAL e arquivamento contínuo (WAL-G → nuvem grátis; ver deploy/vm2/postgres/backup.md) ─────────────────────
wal_level = replica                  # basta para PITR e para a réplica viva da Fase 6
wal_compression = zstd
max_wal_size = 1GB                   # disco da VM-2 é o recurso escasso: checkpoints mais frequentes, pg_wal menor
min_wal_size = 256MB
checkpoint_timeout = 15min
archive_mode = on
# Sem o /etc/wal-g/walg.yaml o comando falha e o WAL ACUMULA em pg_wal (o PostgreSQL não descarta segmento não
# arquivado) — o instalar.sh recusa ligar o arquivamento sem a configuração do WAL-G. Nunca trocar por `true` ou
# `/bin/true`: isso jogaria o WAL fora e o backup teria buraco sem avisar ninguém.
archive_command = '/usr/local/bin/wal-g --config /etc/wal-g/walg.yaml wal-push %p'
archive_timeout = 600                # banco quieto ainda fecha um segmento a cada 10 min: perda máxima ≈ 10 min
max_wal_senders = 3                  # réplica da Fase 6 + folga

# ── observabilidade mínima ────────────────────────────────────────────────────────────────────────────────────
log_min_duration_statement = 2000    # consulta acima de 2 s vai para o log
log_checkpoints = on
log_lock_waits = on
idle_in_transaction_session_timeout = 10min   # worker travado no meio da transação não segura lock para sempre
