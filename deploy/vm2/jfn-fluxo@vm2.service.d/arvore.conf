# O2.4 (24/11/2026): na VM-2 a árvore única é ~/JFN-worker (clone git da VM-1); ~/JFN da VM-2 é a cópia rsync
# antiga e sai depois de 14 dias de religação estável. O template (deploy/systemd/jfn-fluxo@.service) fica com
# %h/JFN, que é o caminho da VM-1. Instalar: ~/.config/systemd/user/jfn-fluxo@vm2.service.d/arvore.conf.
# DSN do PG: ~/.config/jfn/pg_evidencias.env (o template já o lê; fora do git).
[Service]
WorkingDirectory=%h/JFN-worker
Environment=PYTHONPATH=%h/JFN-worker
ExecStart=
ExecStart=%h/JFN-worker/.venv/bin/python -m compliance_agent.fluxo supervisor --no %i
# O9.0 (25/11/2026): ambiente da produção, da própria árvore (deploy/fluxo/producao.env); a autorização do dono para a
# assinatura é só do ensaio O8.5 — nunca no ambiente da produção
EnvironmentFile=%h/JFN-worker/deploy/fluxo/producao.env
UnsetEnvironment=JFN_ASSINATURA_ESCOPO
