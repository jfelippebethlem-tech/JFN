# O9.0 (25/11/2026): árvore e ambiente do jfn-fluxo na VM-1 (o par da VM-2 é deploy/vm2/jfn-fluxo@vm2.service.d/).
# Instalar: ln -sf ~/JFN/deploy/systemd/drop-ins/jfn-fluxo@vm1.service.d/arvore.conf \
#           ~/.config/systemd/user/jfn-fluxo@vm1.service.d/arvore.conf   (tools/religar_o90.py, passo R2)
[Service]
WorkingDirectory=%h/JFN
Environment=PYTHONPATH=%h/JFN
EnvironmentFile=%h/JFN/deploy/fluxo/producao.env
# a autorização do dono para a assinatura é só do ensaio O8.5: nunca no ambiente da produção
UnsetEnvironment=JFN_ASSINATURA_ESCOPO
