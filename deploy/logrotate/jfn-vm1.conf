# Rotação + gzip dos logs grandes da VM-1 (pedido do dono, 21/11/2026: "compacte tudo que puder sem perder
# informação"). Instalado em ~/.config/logrotate/jfn-vm1.conf e rodado pelo cron do usuário (05:15):
#   /usr/sbin/logrotate -s ~/.local/state/jfn-logrotate.state ~/.config/logrotate/jfn-vm1.conf
#
# copytruncate: quem escreve faz `>>` (O_APPEND) — o log VIVO continua o mesmo arquivo, nenhum serviço reinicia.
# rotate 100 + sem maxage: nada é apagado na prática (um log que gira a cada 20 MB leva anos para chegar a 100).
# Medido 21/11 na VM-1 (primeira rodada): 5 logs, 225,6 MB → 8,9 MB (25×), tamanho descomprimido = original.
#
# FORA DE PROPÓSITO:
#   data/sei_sweep.log — tools/cerebro_sync.py lê o arquivo INTEIRO para a taxa do sweep de 7 dias;
#     girar a 20 MB cortaria a janela. Fica como está (15 MB).
#   *.jsonl — são índice/dado (sei_arquivo_frio.jsonl, rag/chunks.jsonl), não log.
/home/ubuntu/JFN/data/sei_refichar.log
/home/ubuntu/JFN/data/varredura_sei.log
/home/ubuntu/JFN/data/sweep_360_llm.out
/home/ubuntu/JFN/data/sweep_360_lote.out
/home/ubuntu/JFN/data/sei_rj_catalogo.log
/home/ubuntu/JFN/data/consulta_media.log
/home/ubuntu/JFN/data/sweep_aval_regras.out
/home/ubuntu/JFN/data/socios_dump_refresh.log
/home/ubuntu/JFN/data/fachada_streetview.log
/home/ubuntu/JFN/data/sei_cache/sei_sweep_loop.out
/home/ubuntu/JFN/data/logs/*.log
{
    size 20M
    rotate 100
    missingok
    notifempty
    copytruncate
    compress
    compresscmd /usr/bin/gzip
    compressoptions -9
    dateext
    dateformat -%Y%m%d-%s
}
