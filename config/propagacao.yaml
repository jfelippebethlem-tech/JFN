# Recalculados FORA do despachante (usam LLM pela assinatura/cascata e têm cron próprio). Entram no grafo para a
# cadeia fechar: fonte → externo → fonte publicada → derivados. O despachante não os executa.
externos:
  lex_execucao:
    nome: Perícia de execução — laudo por processo (tools/lex_execucao.py)
    depende: [sei_arquivado, sei_lote, sei_ficha, siafe_ob, ocr_gpu]
    publica: sei_lex
    cron: "fila_analise_sei.sh lex"
    # sem `teto`: o número certo de laudos na fila da re-perícia não é conhecido; o que se acusa é a fila que NÃO
    # DIMINUI em 24 h (`externo_sem_drenar`, medido pela certeza a cada ciclo)
    atraso: {funcao: "tools.lex_execucao:_recapturados",
             o_que: "laudo de risco alto ou sem execução comprovada dado ANTES da última captura do processo"}
  sei_fichas:
    nome: Ficha do processo SEI (acervo → sei_ficha; tools/fila_analise_sei.sh ficha)
    depende: [sei_arquivado, sei_lote, ocr_gpu]
    publica: sei_ficha
    cron: "fila_analise_sei.sh ficha"
  triagem_alertas:
    nome: Triagem dos alertas — duas leituras + verificação do Opus (compliance_agent/triagem_alertas.py)
    depende: [revisao_humana, sancoes]
    publica: triagem
    cron: "compliance_agent.triagem_alertas"
  conferencia_opus:
    nome: Conferência do Opus do que saiu em contingência (compliance_agent/llm/conferencia_opus.py)
    depende: [sei_lex, triagem]
    publica: conferencia_opus
    cron: "compliance_agent.llm.conferencia_opus"

# Contratos de dados das tabelas de achado e de fila (compliance_agent/certeza/portoes.py). Auditados a cada ciclo
# (controle detectivo, só leitura); `nivel_prova` liga a fotografia que acusa linha que REGREDIU de nível.
contratos:
  sei_fila_captura:
    tabela: sei_fila_captura
    chave: [numero_sei]
    # 18/11/2026: total_pago = 1e12 gravado só para furar a fila. Valor pago é dado, não prioridade.
    colunas: {total_pago: {monetaria: true, min: 0, max: 2.0e10}}
    proveniencia: [motivo, visto_em]
  lex_execucao:
    tabela: lex_execucao
    chave: [numero_sei]
    colunas: {nota_risco: {tipo: int, min: 0, max: 10}}
    proveniencia: [modelo, em]
    nivel_prova: {coluna: modelo, funcao: "compliance_agent.autoaprimoramento.ledger:nivel_gravado"}
  alertas_triagem:
    tabela: alertas_triagem
    chave: [alerta_id]
    colunas: {nota: {min: 0, max: 10}, valor: {monetaria: true, min: 0, max: 2.0e11}}
    proveniencia: [motor, em]
    nivel_prova: {casos: [[1, {estado: VERIFICADO}]], padrao: 0}
  ob_orcamentaria_siafe:
    tabela: ob_orcamentaria_siafe
    chave: [numero_ob, ug_emitente, exercicio]
    colunas:
      valor: {monetaria: true, max: 5.0e9}
      status_envio: {dominio: ["", "Processado e Pago", "Enviado Manualmente", "Parcialmente Pago", "Enviado ao Banco",
                               "Aguardando Envio", "Aguardando Geração RE", "Erro no Pagamento"]}

certeza:
  superficies:
    vault: {pasta: "~/vault", glob: "**/*.md", ignorar: [".obsidian", ".trash", "aprendizados/automelhoria"], sincronizar: true}
    docs: {pasta: docs, glob: "**/*.md", ignorar: [ARQUITETURA-DE-CERTEZA.md]}
    memoria: {pasta: "~/.claude/projects/-home-ubuntu/memory", glob: "*.md"}
    cerebro: {registro: true, busca: true}

# Descobertas VERIFICADAS que vão ao segundo cérebro (consultas só-leitura; 1 linha = 1 memória; mudou = substitui).
# Só entra o que já passou pela verificação da casa (duas leituras + Opus, ou ato humano) e NÃO tem pessoa física
# vinculada (pessoa_id nulo). Texto com CPF/e-mail/segredo é recusado pelo cliente antes de sair da máquina.
cerebro:
  - id: triagem_verificada
    kind: semantica
    chave: "alerta:{id}"
    assunto: "alerta {tipo}"
    # Emendas com o NOME do parlamentar (D2, D6) e D5 (nomeia o sócio doador, particular) ficam fora: as duas
    # primeiras vão pelo bloco `emendas_parlamentar`, com fonte, estado e ressalva; D5 não vai.
    sql: >-
      SELECT a.id AS id, a.tipo AS tipo, substr(a.titulo,1,220) AS titulo, t.prioridade AS prioridade,
             COALESCE('nota ' || t.nota || '/10', 'sem nota registrada') AS nota,
             CASE WHEN COALESCE(t.proximo_passo,'') <> '' THEN ' Próximo passo: ' || substr(t.proximo_passo,1,300) ELSE '' END AS proximo_passo,
             substr(t.em,1,10) AS em
      FROM alertas_triagem t JOIN alertas a ON a.id = t.alerta_id
      WHERE t.estado = 'VERIFICADO' AND t.verificado_por IS NOT NULL
        AND t.prioridade IN ('aprofundar', 'monitorar') AND a.pessoa_id IS NULL
        AND a.tipo NOT LIKE 'emendas_d2%' AND a.tipo NOT LIKE 'emendas_d5%' AND a.tipo NOT LIKE 'emendas_d6%'
    texto: >-
      JFN — alerta #{id} ({tipo}) com triagem VERIFICADA em {em} (duas leituras + Opus): {prioridade}, {nota}.
      {titulo}.{proximo_passo} Indício interno, não acusação; a confirmação é ato humano.
  - id: alerta_confirmado
    kind: decisoria
    chave: "alerta-humano:{id}"
    assunto: "alerta {tipo}"
    sql: >-
      SELECT id, tipo, substr(titulo,1,220) AS titulo FROM alertas WHERE status = 'confirmado' AND pessoa_id IS NULL
    texto: "JFN — alerta #{id} ({tipo}) CONFIRMADO por revisão humana: {titulo}."
  - id: emendas_parlamentar
    # decisão do dono, 14/11/2026: alerta de emenda VERIFICADO com o nome do parlamentar (pessoa pública no exercício
    # do mandato) entra no cérebro, com fonte, estado e "indício não é acusação"; nunca CPF. Regras no módulo.
    kind: semantica
    funcao: "compliance_agent.emendas.cerebro_alertas:descobertas"
