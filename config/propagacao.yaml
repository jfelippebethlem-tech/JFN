    depende: [siafe_ob, siafe_status, pericia_contabil]
    comando: ["{py}", "tools/cerebro_sync.py"]
    peso: leve
    debounce_s: 1800
    intervalo_min_s: 21600
    timeout_s: 900
    prioridade: 8
    antes: "diário 06:25 (cron)"
  cerebro_ponte:
    nome: Ponte automelhoria e perícias por agente → segundo cérebro (fatos com chave, índice de entidade, notas e cor por órgão no vault)
    onde: registro do cérebro (data/propagacao.db) → jfn-brain · vault ~/vault/jfn/pericias-agente/ e jfn/automelhoria-licoes.md · docs/ARQUITETURA-SEGUNDO-CEREBRO.md
    # sem LLM e sem rede: só registra; quem envia é este despachante. Nível de prova medido por código (citação
    # literal no texto arquivado do processo; OB por número e valor no SIAFE). Só relê o processo de laudo novo/alterado.
    depende: [pericia_agentes, autoaprimoramento_registro]
    comando: ["{py}", "-m", "compliance_agent.cerebro_ponte", "sincronizar"]
    peso: leve
    debounce_s: 600
    intervalo_min_s: 1800
    timeout_s: 1800
    prioridade: 9
    efeito: {arquivo: data/cerebro_ponte_estado.json}
    antes: "não existia — veredito do portão ficava só em data/autoaprimoramento/auto.db e o laudo por agente só no JSON"
  cerebro_bateria:
    nome: Bateria de recall do segundo cérebro (78 perguntas → a nota certa volta entre as 10 primeiras? o cruzamento por entidade vem inteiro?)
    onde: data/cerebro_bateria/ultimo.json + historico.jsonl · docs/ARQUITETURA-SEGUNDO-CEREBRO-ALVO.md §7
    # só leitura (jfn-brain pela Tailnet + índice local do vault), sem LLM. Roda depois que as notas geradas mudam,
    # no máximo 1× por dia. `--minimo 53` é a catraca: recall@10 do `fundido` abaixo de 53/56 = falha visível aqui.
    depende: [cerebro_ponte, vault_retratos, vault_casos]
    comando: ["{py}", "tools/cerebro_bateria.py", "medir", "--sistemas", "brain_mcp,brain_entity,fundido", "--rotulo", "despachante", "--minimo", "53"]
    peso: leve
    debounce_s: 1800
    intervalo_min_s: 86400
    timeout_s: 900
    prioridade: 9
    efeito: {arquivo: data/cerebro_bateria/ultimo.json}
    antes: "não existia — a qualidade da busca só foi medida à mão, em 14/11 (rodada cega) e 19/11/2026"
  vault_retratos:
    nome: Retratos do JFN no vault (perícia, orçamento por exercício e mês, gestão Couto, CGE × JFN, municípios, sobrepreço, sinais críticos)
    onde: vault ~/vault/jfn/ (índice jfn/00-retratos.md) → segundo cérebro (indexa a cada 10 min)
    # lê as ROTAS do painel (só GET em 127.0.0.1:8000): por isso depende dos caches do painel, não das fontes cruas —
    # roda depois que o número novo já está no painel. Não regrava nota cujo conteúdo não mudou (sem ruído no Syncthing).
    # Sobrepreço não tem sonda própria: entra de carona na próxima rodada (há pelo menos uma por dia, pela OB do SIAFE).
    depende: [pericia_contabil, governo_couto_regras, cge_confronto, territorio, painel_ob, painel_contratos]
    comando: ["{py}", "-m", "compliance_agent.vault_retratos"]
    peso: leve
    debounce_s: 900
    intervalo_min_s: 10800
    timeout_s: 600
    prioridade: 9
    efeito: {arquivo: data/vault_retratos_estado.json}
    antes: "não existia (o vault só recebia os blocos de caso e o estado do sistema, 1× ao dia)"
    cerebro:
      # perícia contábil e CGE × JFN NÃO entram aqui: já são memória dos próprios derivados (não duplicar)
      arquivo: data/vault_retratos_estado.json
      assunto: "retratos do JFN — gestão Couto, sobrepreço, mapa por município"
      campos:
        "Gestão Couto: pontos de atenção VERIFICADOS graves": manchetes.couto_graves
        "Gestão Couto: pontos de atenção VERIFICADOS em atenção": manchetes.couto_atencao
        "Sobrepreço: compras conferidas no PNCP fora de ata": manchetes.sobrepreco_compras
        "Sobrepreço: excesso estimado conferido (quantidade homologada, não é pagamento)": manchetes.sobrepreco_excesso
        "Mapa por município: contratos vigentes atribuídos a município": manchetes.territorio_atribuidos
        "Mapa por município: contratos vigentes sem município identificado": manchetes.territorio_sem_municipio
      ressalva: "Detalhe, fonte e estado de cada número nas notas do vault em jfn/. Indício interno para requerer documentos, não acusação."
  conformidade:
    nome: Conformidade — sensores das regras de qualidade
    onde: Sistema › Conformidade
    depende: [regra_detectores, pericia_contabil, governo_couto_regras, cge_confronto]
    comando: ["{py}", "-m", "compliance_agent.qualidade", "sensores"]
    peso: leve
    debounce_s: 300
    intervalo_min_s: 3600
    timeout_s: 1200
    prioridade: 8
    efeito: {arquivo: data/qualidade_estado.json}
    antes: "a cada 3 h, dentro da automelhoria (cron 40 */3)"
  juiz_fila:
    nome: Fila e cobertura do juiz de qualidade (afirmação sem veredito para o texto atual)
    onde: Sistema › Conformidade (juiz — cobertura, pendentes, idade da mais antiga) · sensor CST-15
    # SEM LLM: só remede a fila (candidatas × histórico por impressão) e grava a cobertura. O JULGAMENTO continua nas
    # janelas noturnas (cron do juiz, `--ate-esvaziar --minutos N`) — nunca se chama o Claude a cada ciclo do despachante.
    # A trava é a da própria rodada do juiz: com ela ocupada o despachante espera (a rodada grava a cobertura a cada lote).
    depende: [vault_casos_md, produtos_casa, governo_couto_regras, painel_ob, painel_contratos, regra_detectores]
    comando: ["{py}", "-m", "compliance_agent.qualidade", "cobertura"]
    trava_externa: data/qualidade_juiz.lock
    peso: leve
    debounce_s: 900
    intervalo_min_s: 3600
    timeout_s: 600
    prioridade: 9
    efeito: {arquivo: data/qualidade_juiz_fila.json}
    antes: "não existia — o que ficava sem juízo só aparecia na rodada noturna (amostra de 6 a 12 de 166)"
  painel_ob:
    nome: Painel — caches que somam OB (por ano e mês, orçamento por órgão, Governo Couto, frescor)
    onde: Estado › Orçamento por órgão · Estado › Governo Couto · filtro Ano/Mês · Sistema › Motores (frescor)
    tipo: cache
    depende: [siafe_ob, siafe_status, siafe_gd, regra_orcamento, regra_pericia, governo_couto_regras]
    prefixos: ["periodo:ob_siafe", "orcamento_orgao:", "governo_couto:base", "fontes:frescor"]
    urls:
      "periodo/ob_siafe": "periodo:ob_siafe"
      "orcamento_orgao": "orcamento_orgao:"
      "governo_couto": "governo_couto:base"
      "fontes/frescor": "fontes:frescor"
    peso: pesado
    debounce_s: 600
    intervalo_min_s: 1800
    prioridade: 4
    antes: "validade de 1 h + pré-aquecimento a cada 30 min (o valor velho durava até 1 h 30)"
  painel_contratos:
    nome: Painel — caches de contratos, aditivos e TAC por período
    onde: filtro Ano/Mês das abas de contratos (Estado e Prefeitura)
    tipo: cache
    depende: [contratos_tcerj, doerj]
