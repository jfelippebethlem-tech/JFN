# propagacao.yaml — MAPA DE DEPENDÊNCIAS do JFN (fonte única; lido por compliance_agent/propagacao.py).
# Medido em 14/11/2026 no código, no crontab, nos timers e nas tabelas. `python -m compliance_agent.propagacao mapa`
# imprime este mapa em tabela; o painel mostra o estado em Sistema › Propagação.
#
# FONTES — o que muda. `sonda` percebe a mudança DE FORA (o produtor não é tocado):
#   sql:     consulta só-leitura; o resultado é a assinatura (1 inteiro que cresce → evento "+N"); `detalhe` =
#            consulta do que mudou desde a 1ª coluna anterior, resumida por `extrator` (propagacao.EXTRATORES)
#   arquivo: mtime+tamanho
#   log:     linhas novas que casam `regex` → 1 evento cada (`texto` com {1},{2}; `minimo: [grupo, valor]` filtra)
#   git:     commits novos que tocam os caminhos (`assunto` = regex do título)
#   pasta:   arquivos com mtime novo (`glob`)
#   (sem sonda) = fonte manual: `python -m compliance_agent.propagacao emitir <fonte> "<detalhe>"`
#   `cerebro: {de: commit|memoria, …}` = o evento da fonte também é DESCOBERTA para o segundo cérebro
#            (commit: só `fix`, uma vez por commit; memoria: a descrição do arquivo de memória).
#
# DERIVADOS — o que fica velho. Campos:
#   depende          fontes e/ou outros derivados (derivado recalculado vira evento para os seus dependentes)
#   comando          argv (`{py}` = python do venv); rotina JÁ EXISTENTE, idempotente, sem API paga
#   tipo: cache      vence chaves do cache do painel (`prefixos`) e pede as rotas (`urls: {rota: prefixo-da-chave}`);
#                    o recálculo roda DENTRO do jfn.service (threads, sem nice) — soma de OB é `pesado`
#   peso             leve (carga ≤ 14) | pesado (um por ciclo, carga ≤ 7; sujo há mais de 2 h, ≤ 12)
#   debounce_s       janela de junção: espera contada do 1º evento pendente, para recalcular uma vez só
#   intervalo_min_s  mínimo entre duas execuções · timeout_s · prioridade (menor = antes)
#   efeito.arquivo   arquivo que TEM de ser regravado para o recálculo valer (rodou sem efeito = falha)
#   trava            flock POR TAREFA (padrão data/locks/<id>.lock). O despachante não dispara a tarefa com a trava
#                    ocupada e o filho a herda enquanto roda; o cron-rede usa `flock -n` no MESMO arquivo (15/11/2026:
#                    cron 00:30 e despachante gravaram o vínculo juntos). trava_externa = trava que a própria tarefa
#                    segura por dentro: só consultada.
#   antes            como se atualizava antes da propagação (só documentação — os crons antigos seguem como rede)
#   cerebro          número de manchete que vira memória no cérebro; se mudar, a nova SUBSTITUI a anterior
#                    (sem data nos campos: recálculo que não muda o número não gera memória nova)
#
# CERTEZA (18/11/2026 — docs/ARQUITETURA-DE-CERTEZA.md; lido por compliance_agent/certeza, o despachante ignora):
#   fatos            (em fonte, derivado ou externo) o que o nó PUBLICA no registro de fatos. Bloco:
#                    id "familia:{campo}:…" · arquivo (JSON) + lista (+ filtro {campo, min}), ou sql · medidas {nome: {campo, unidade}} ·
#                    estado / nivel_prova / natureza / base (fixos ou `<nome>_por: {campo, mapa, padrao}`) · fonte ·
#                    data_ref · apelidos/termos (para achar menção em texto) · superados (valor de medição anterior
#                    a este registro) · reconcilia (o agregado tem de bater com as linhas de detalhe)
#   frescor_max_s    (derivado) sujo há mais que isto = ATRASADO (padrão: o maior entre 6 h e 3× intervalo_min_s)
#   manual: true     (fonte) evento só entra por `emitir`, de propósito
#   externos:        recalculado FORA do despachante (LLM, cron próprio): depende · publica (a fonte que alimenta) ·
#                    cron (trecho da linha do crontab) · atraso {funcao, teto} (conta o que está velho)
#   contratos:       contrato de dados de tabela de achado: chave · colunas {min, max, monetaria, tipo, nulo, dominio}
#                    · proveniencia [colunas obrigatórias] · nivel_prova {coluna+funcao | casos+padrao}
#   certeza:         superfícies onde o verificador procura citação (`<!--fato:ID-->`) e menção a valor superado

fontes:
  siafe_ob:
    nome: OB nova ou regravada no SIAFE
    sonda: {sql: "SELECT MAX(rowid) FROM ob_orcamentaria_siafe", unidade: "OB(s) gravada(s) (novas ou recoletadas)"}
    fatos:
      # o STATUS ao lado do valor (18/11/2026): "Contabilizado" não basta para dizer PAGO. Mesmo filtro de
      # cruzamentos_intel._ob_paga; o que muda é que cada status de envio é um fato, com o seu estado.
      - id: "siafe_ob:contabilizada:{envio}"
        sql: >-
          SELECT CASE WHEN status_envio IN ('Processado e Pago','Enviado Manualmente','Parcialmente Pago','Enviado ao Banco',
                 'Aguardando Envio','Aguardando Geração RE') THEN status_envio ELSE 'fora do dominio' END AS envio,
                 COUNT(*) AS n, ROUND(SUM(valor), 2) AS valor
          FROM ob_orcamentaria_siafe
          WHERE status='Contabilizado' AND COALESCE(status_envio,'')<>'Erro no Pagamento' AND COALESCE(numero_ob,'')<>''
          GROUP BY 1
        rotulo: "OB Contabilizada do SIAFE (todos os exercícios coletados) — status de envio '{envio}'"
        fonte: "SIAFE-Rio 2 — ob_orcamentaria_siafe (compliance.db), status='Contabilizado', sem 'Erro no Pagamento', com número de OB"
        natureza: pago
        nivel_prova: 2
        estado_por:
          campo: envio
          padrao: PENDENTE
          mapa: {"Processado e Pago": VERIFICADO, "Enviado Manualmente": VERIFICADO, "Parcialmente Pago": "A CONFERIR"}
        base_por:
          campo: envio
          padrao: ob_contabilizada_sem_confirmacao
          mapa: {"Processado e Pago": ob_contabilizada_confirmada, "Enviado Manualmente": ob_contabilizada_confirmada}
        medidas:
          valor: {campo: valor, unidade: BRL}
          n: {campo: n, unidade: contagem}
  siafe_status:
    nome: Status de envio de OB recoletado (devolvida pelo banco, paga)
    # a TABELA, não o log: o siafe_runner corta a linha do log em 400 caracteres
    sonda: {sql: "SELECT COALESCE(MAX(recoletado_em), ''), COUNT(*) FROM ob_status_recoleta",
            detalhe: "SELECT data_emissao, transicoes FROM ob_status_recoleta WHERE recoletado_em > ? AND sem_mudanca = 0",
            extrator: siafe_status}
  siafe_gd:
    nome: Guia de Devolução ingerida
    sonda: {log: data/siafe_runner.log, regex: 'pós-coleta (\d{4}) gd: .*"ingeridas": (\d+)', minimo: [2, 1],
            texto: "{2} Guia(s) de Devolução ingerida(s) no exercício {1}"}
  sei_lote:
    nome: Lote SEI de outro nó (VM-2 / it-campo) aprovado na conferência
    sonda: {log: data/vm2_conferencia.log, regex: 'LOTE (\S+) \((\w+)\): (\d+) aprovado\(s\), (\d+) em quarentena',
            minimo: [3, 1], texto: "lote {1} ({2}): {3} processo(s) aprovado(s), {4} em quarentena"}
  sei_arquivado:
    nome: Processo SEI capturado ou recapturado na VM-1 (arquivado)
    sonda: {log: data/arquivar_cache.log, regex: '^arquivados: (\d+) processos', minimo: [1, 1],
            texto: "{1} processo(s) arquivado(s) do cache"}
  sei_ficha:
    nome: Ficha de processo SEI nova
    sonda: {sql: "SELECT MAX(rowid) FROM sei_ficha", unidade: "ficha(s)"}
  sei_lex:
    nome: Parecer de execução (Lex) novo
    sonda: {sql: "SELECT MAX(rowid) || '|' || MAX(em) FROM lex_execucao", unidade: "parecer(es) de execução (novo ou reconferido)"}
  sei_leitura_dupla:
    nome: Leitura dupla nova
    sonda: {sql: "SELECT MAX(rowid) FROM sei_leitura_dupla", unidade: "leitura(s) dupla(s)"}
  contratos_tcerj:
    nome: Contrato novo no TCE-RJ / PNCP / SIGA
    sonda: {sql: "SELECT (SELECT MAX(rowid) FROM contratos_tcerj), (SELECT MAX(rowid) FROM siga_contratos), (SELECT MAX(rowid) FROM contrato_aditivo), (SELECT MAX(rowid) FROM pncp_resultado)",
            mudanca: "contratos, aditivos ou resultados novos na base"}
  tcerj_licitante:
    nome: Licitantes novos do TCE-RJ (vencedor e perdedor por certame municipal)
    sonda: {sql: "SELECT COUNT(*) FROM tcerj_licitante", unidade: "linha(s) de licitante"}
  sancoes:
    nome: Sanção nova (CEIS/CNEP/CEPIM)
    sonda: {sql: "SELECT MAX(rowid) FROM sancoes_federais", unidade: "sanção(ões)"}
  doerj:
    nome: Ato novo no DOERJ (contratação, TAC)
    sonda: {sql: "SELECT (SELECT MAX(rowid) FROM contrato_doe_evento), (SELECT MAX(rowid) FROM doerj_tac)",
            mudanca: "atos novos do DOERJ na base"}
  triagem:
    nome: Veredito novo na triagem de alertas (leituras, Opus)
    sonda: {sql: "SELECT COUNT(*), SUM(estado='VERIFICADO'), SUM(verificado_por IS NOT NULL) FROM alertas_triagem",
            mudanca: "triagem avançou (novas leituras ou verificações do Opus)"}
  revisao_humana:
    nome: Revisão humana de alerta (confirmado / descartado)
    sonda: {sql: "SELECT status, COUNT(*) FROM alertas GROUP BY status ORDER BY status",
            mudanca: "situação de alertas mudou (confirmação ou descarte)"}
  regra_pericia:
    nome: Correção na régua da perícia contábil / Guia de Devolução / termo aditivo nos autos
    sonda: {git: [compliance_agent/pericia_contabil.py, compliance_agent/pericia_contabil_rotina.py, compliance_agent/siafe_gd.py,
                  compliance_agent/aditivo_autos.py]}
    cerebro: {de: commit, kind: experiencial, rotulo: "correção de regra da perícia contábil", assunto: "perícia contábil"}
  regra_emendas:
    nome: Correção nos detectores de emendas (D1–D6)
    sonda: {git: [compliance_agent/emendas/pericia.py, compliance_agent/sancao_abrangencia.py, compliance_agent/sancao_impeditiva.py]}
  regra_pcrj:
    nome: Correção nos detectores da Prefeitura (D7–D12)
    sonda: {git: [compliance_agent/pcrj/pericia_gastos.py]}
  pcrj_base:
    nome: Despesa, contrato ou licitação nova da Prefeitura do Rio
    sonda: {sql: "SELECT (SELECT MAX(rowid) FROM pcrj_despesa), (SELECT MAX(rowid) FROM pcrj_contratos), (SELECT MAX(rowid) FROM pcrj_licitacoes)",
            mudanca: "despesa/contratos/licitações municipais novos na base"}
  emendas_base:
    nome: Emenda nova na base
    sonda: {sql: "SELECT MAX(rowid) FROM emendas", unidade: "emenda(s)"}
  ocr_gpu:
    nome: Texto novo do OCR por IA (GPU do it-campo, Surya 2.5) chegou ao cache SEI
    sonda: {pasta: "data/sei_cache", glob: "integra_*/*.ocr_gpu.txt"}
  ocr_reserva:
    nome: Texto novo do OCR de reserva (RapidOCR em CPU — VM-2 com a GPU parada; it-campo em paralelo) chegou ao cache SEI
    sonda: {pasta: "data/sei_cache", glob: "integra_*/*.ocr_reserva.txt"}
  regra_vinculo:
    nome: Correção na regra do vínculo OB↔contrato
    sonda: {git: [compliance_agent/vinculo_ob_contrato.py]}
    cerebro: {de: commit, kind: experiencial, rotulo: "correção de regra do vínculo OB↔contrato", assunto: "vínculo OB↔contrato"}
  regra_territorio:
    nome: Correção no motor território (mapa por município)
    sonda: {git: [compliance_agent/territorio]}
    cerebro: {de: commit, kind: experiencial, rotulo: "correção no mapa por município", assunto: "território"}
  regra_governo_couto:
    nome: Correção nas regras da gestão Couto
    sonda: {git: [compliance_agent/governo_couto.py, compliance_agent/governo_couto_regras.py]}
    cerebro: {de: commit, kind: experiencial, rotulo: "correção nas regras da gestão Couto", assunto: "governo Couto"}
  regra_orcamento:
    nome: Correção no orçamento por órgão
    sonda: {git: [compliance_agent/orcamento_orgao.py, compliance_agent/comissao_orcamento.py]}
    cerebro: {de: commit, kind: experiencial, rotulo: "correção no orçamento por órgão", assunto: "orçamento por órgão"}
  regra_detectores:
    nome: Correção de detector ou de regra de qualidade
    sonda: {git: [compliance_agent/detectores, compliance_agent/qualidade, config/qualidade_regras.yaml, config/qualidade_detectores.yaml, config/qualidade_inventario.yaml],
            assunto: '^(fix|feat|perf)'}
    cerebro: {de: commit, kind: experiencial, rotulo: "correção de detector/regra de qualidade", assunto: "detectores e regras de qualidade"}
  regra_iss_retido:
    nome: Correção no detector de ISS retido na NF × OB
    sonda: {git: [compliance_agent/detector_iss_retido.py]}
  memoria_claude:
    nome: Decisão do dono ou lição registrada na memória dos agentes
    sonda: {pasta: "~/.claude/projects/-home-ubuntu/memory", glob: "*.md", ignorar: [MEMORY.md]}
    cerebro: {de: memoria}
  conferencia_opus:
    # sem sonda: quem emite é `llm/conferencia_opus.conferir` quando o Opus DIVERGE do modelo de contingência e o
    # aplicador regrava o registro (UPDATE não muda o MAX(rowid) que a sonda `sei_lex` olha)
    nome: Conferência do Opus corrigiu resultado produzido em contingência (Claude da assinatura no limite)
  decisao_dono:
    nome: Decisão do dono que muda requisito (manual)
    manual: true

derivados:
  vinculo_ob_contrato:
    nome: Vínculo OB↔contrato (regra determinística)
    onde: Estado › Perícia contábil (reduz indeterminados)
    depende: [sei_lote, sei_arquivado, contratos_tcerj, regra_vinculo]
    comando: ["{py}", "-m", "compliance_agent.vinculo_ob_contrato", "regra", "--gravar", "--cache", "data/vinculo_ob_modelo_cache.json"]
    peso: pesado
    debounce_s: 1800
    intervalo_min_s: 10800
    timeout_s: 1800
    prioridade: 2
    antes: "diário 00:30 (cron). A leitura por modelo (01:50, API paga) NÃO é propagada"
  pericia_contabil:
    nome: Perícia contábil de todos os contratos
    onde: Estado › Perícia contábil · Início › Sinais críticos
    depende: [siafe_ob, siafe_status, siafe_gd, contratos_tcerj, regra_pericia, vinculo_ob_contrato]
    comando: ["{py}", "-m", "compliance_agent.pericia_contabil_rotina"]
    peso: pesado
    debounce_s: 600
    intervalo_min_s: 3600
    timeout_s: 3600
    prioridade: 3
    efeito: {arquivo: data/pericia_contabil_resumo.json}
    antes: "diário 01:30 (cron)"
    cerebro:
      arquivo: data/pericia_contabil_resumo.json
      assunto: "perícia contábil — placar"
      campos:
        "Estado: contratos avaliados": "esferas.Estado do RJ.n"
        "Estado: placar": "esferas.Estado do RJ.placar"
        "Estado: pago acima do valor contratado (R$)": "esferas.Estado do RJ.excesso_a_maior"
        "Prefeitura: contratos avaliados": "esferas.Prefeitura do Rio.n"
        "Prefeitura: placar": "esferas.Prefeitura do Rio.placar"
      ressalva: "Pago do Estado = só OB Contabilizada do SIAFE. Indício interno para requerer documentos, não acusação."
    fatos:
      - id: "pericia_contabil:estado"
        arquivo: data/pericia_contabil_resumo.json
        data_ref: gerado_em
        rotulo: "Perícia contábil — Estado do RJ"
        fonte: "compliance_agent.pericia_contabil sobre contratos_tcerj/PNCP × OB Contabilizada do SIAFE"
        # agregado determinístico que depende do vínculo OB↔contrato: não conferido contrato a contrato → nível 1
        nivel_prova: 1
        estado: PENDENTE
        medidas:
          contratos_avaliados: {campo: "esferas.Estado do RJ.n", unidade: contagem}
          pago_acima_do_contratado_n: {campo: "esferas.Estado do RJ.placar.A_MAIOR", unidade: contagem}
          pago_acima_do_contratado_valor: {campo: "esferas.Estado do RJ.excesso_a_maior", unidade: BRL}
          indeterminados: {campo: "esferas.Estado do RJ.placar.INDETERMINADO", unidade: contagem}
  pericia_emendas:
    nome: Perícia das emendas (D1–D6) — regrava os alertas emendas_*
    onde: Transversal › Alertas · Galáxia (alertas de emenda)
    depende: [sancoes, emendas_base, regra_emendas]
    comando: ["{py}", "-m", "tools.emendas_pericia", "--sem-pdf", "--sem-colegiado"]
    peso: pesado
    debounce_s: 1800
    intervalo_min_s: 43200
    timeout_s: 3600
    prioridade: 5
    antes: "nenhum — rodava à mão; alertas parados de 10/08 a 17/11/2026 (pente fino de 18/11)"
  pericia_pcrj:
    nome: Perícia de gastos da Prefeitura (D7–D12) — regrava os alertas pcrj_*
    onde: Prefeitura · Transversal › Alertas
    depende: [pcrj_base, sancoes, regra_pcrj]
    comando: ["{py}", "-m", "tools.pcrj_pericia_gastos", "--sem-pdf", "--sem-colegiado"]
    peso: pesado
    debounce_s: 1800
    intervalo_min_s: 43200
    timeout_s: 5400
    prioridade: 6
    antes: "nenhum — rodava à mão; alertas parados desde 10/08/2026 (pente fino de 18/11)"
  sei_ocr_gpu:
    nome: Aplica o OCR por IA ao arquivo SEI (preenche sem texto; relê o que o Tesseract leu; nativo intocado)
    onde: arquivo canônico data/sei_arquivo → fichas, perícia de execução, extrator de preços
    depende: [ocr_gpu, ocr_reserva]
    comando: ["{py}", "-m", "tools.sei_ocr_gpu_integrar"]
    peso: leve
    debounce_s: 600
    intervalo_min_s: 900
    timeout_s: 1800
    prioridade: 4
    antes: "nenhum — criado em 18/11/2026 com o nó de GPU do it-campo"
  sei_ocr_gpu_fila:
    nome: Fila do OCR por IA (o que o Tesseract leu ou ficou sem texto e ainda tem PDF no arquivo frio)
    onde: it-campo (trabalhador ocr_gpu_worker puxa data/sei_ocr_gpu_fila.txt quando a dele acaba)
    depende: [sei_arquivado, ocr_gpu]
    comando: ["{py}", "-m", "tools.sei_ocr_gpu_fila"]
    peso: leve
    debounce_s: 1800
    intervalo_min_s: 21600
    timeout_s: 900
    prioridade: 7
    efeito: {arquivo: data/sei_ocr_gpu_fila.txt}
    antes: "nenhum — criado em 18/11/2026"
  propostas_sei:
    nome: Preços das propostas/cotações dos autos SEI → proposta_item (só linha em que q × unitário = total) + J9
    onde: proposta_item (fonte sei_proposta) → J9 propostas gêmeas · screens de conluio
    depende: [sei_arquivado, ocr_gpu]
    comando: ["{py}", "-m", "tools.propostas_sei_extrair"]
    peso: leve
    debounce_s: 1800
    intervalo_min_s: 21600
    timeout_s: 1800
    prioridade: 7
    efeito: {arquivo: data/propostas_sei_extrair.json}
    antes: "nenhum — criado em 18/11/2026 (determinístico, sem LLM)"
  vinculo_fila:
    nome: Fila de captura do vínculo OB↔contrato (fecha-contrato na frente, depois por valor)
    onde: estrato VINCULO_OB da fila do sweep SEI (VM-1, VM-2, it-campo)
    depende: [pericia_contabil, regra_vinculo]
    comando: ["{py}", "-m", "compliance_agent.vinculo_ob_contrato", "fila"]
    peso: pesado
    debounce_s: 900
    intervalo_min_s: 14400
    timeout_s: 2700
    prioridade: 4
    efeito: {arquivo: data/sei_fila_vinculo_ob.json}
    antes: "diário 05:15 (cron)"
  indeterminados:
    nome: Laudo de execução sem conclusão — causa medida, processo-mãe citado nos autos → fila SEI, fontes externas
    onde: data/indeterminados/{estado,fila_captura,diagnostico}.json · sei_fila_captura (motivo indeterminado_relacionado) · tabela indeterminado_evidencia
    # sem LLM e sem rede: lê o arquivo SEI (incremental por mtime do manifesto, teto de leitura por rodada), o SIAFE e as
    # tabelas TCE-RJ/SIGA/DOERJ já coletadas. A fila_captura.json é lida pelo drenador (sei_integra_fila._fila_indeterminados);
    # a reperícia é do lex_execucao (_recapturados: captura mais nova que o laudo).
    depende: [sei_lex, sei_arquivado, sei_lote, siafe_ob, contratos_tcerj, doerj]
    comando: ["{py}", "-m", "compliance_agent.indeterminados", "ciclo", "--max-ler", "150", "--max-externo", "300"]
    peso: pesado
    debounce_s: 1800
    intervalo_min_s: 21600
    timeout_s: 3000
    prioridade: 6
    efeito: {arquivo: data/indeterminados/estado.json}
    antes: "não existia — 4.296 laudos sem conclusão (18/11/2026) sem causa medida; processo-mãe citado nos autos não entrava em fila"
  governo_couto_regras:
    nome: Gestão Couto — regras D01–D20 e hipóteses
    onde: Estado › Governo Couto · Início › Sinais críticos
    depende: [siafe_status, siafe_gd, regra_pericia, regra_governo_couto]
    comando: ["{py}", "-m", "compliance_agent.governo_couto_regras"]
    env: {PATH: "/home/ubuntu/.local/bin:/home/ubuntu/.npm-global/bin:/usr/bin:/bin"}
    peso: pesado
    debounce_s: 1800
    intervalo_min_s: 86400
    timeout_s: 5400
    prioridade: 6
    efeito: {arquivo: data/governo_couto_suspeitas.json}
    antes: "semanal, domingo 08:10 (cron); desde 14/11/2026 a rede é diária, 19:05, e só roda se o arquivo tiver mais de 20 h"
  territorio:
    nome: Mapa por município / AP (territorio.db)
    onde: Estado › Mapa por município · Prefeitura › Mapa por AP
    depende: [contratos_tcerj, regra_territorio]
    comando: ["{py}", "-m", "compliance_agent.territorio.cli", "--incremental"]
    trava_externa: data/territorio.lock   # a CLI segura esta trava por dentro (timer jfn-territorio também)
    peso: pesado
    debounce_s: 900
    intervalo_min_s: 7200
    timeout_s: 1800
    prioridade: 5
    antes: "a cada 6 h (timer jfn-territorio)"
  iss_nao_retido:
    nome: ISS declarado retido na NFS-e × OB paga sem a retenção
    onde: data/iss_nao_retido.json (casos do vault; indício para requerer documentos)
    depende: [sei_lote, sei_arquivado, siafe_ob, siafe_status, regra_iss_retido]
    comando: ["{py}", "-m", "compliance_agent.detector_iss_retido"]
    peso: pesado
    debounce_s: 3600
    intervalo_min_s: 86400
    timeout_s: 3600
    prioridade: 6
    efeito: {arquivo: data/iss_nao_retido.json}
    fatos:
      - id: "iss_nao_retido:{credor}:{ug}"
        arquivo: data/iss_nao_retido.json
        lista: por_fornecedor
        filtro: {campo: processos_iss_nao_retido, min: 1}   # quem sai da lista aparece como "a fonte não produz mais"
        data_ref: gerado_em
        rotulo: "ISS declarado retido na NFS-e e pago ao prestador (OB sem a retenção) — {nome_credor} × UG {ug}"
        fonte: "NFS-e dos autos SEI (data/sei_arquivo, documentos do manifesto) × OB Contabilizada do SIAFE; conta fechada NF a NF ao centavo (compliance_agent/detector_iss_retido.py)"
        nivel_prova: 2
        estado: VERIFICADO
        apelidos: ["{nome_credor}", "{credor}"]
        apelidos_por: {"28470707000180:294200": [IDESI]}
        termos: [ISS]
        medidas:
          valor: {campo: iss_nao_retido, unidade: BRL}
          processos: {campo: processos_iss_nao_retido, unidade: contagem}
        # 1ª medição (manual, 18/11/2026, antes do detector): 35 processos / R$ 2.270.009,39. O detector mediu 38.
        superados:
          "00801512000157:180100": {valor: 2270009.39, processos: 35}
        reconcilia:
          lista: registros
          onde: {credor: "$credor", ug: "$ug", classe: ISS_NAO_RETIDO, estado: VERIFICADO}
          medidas: {valor: {soma: iss_nao_retido}, processos: {distintos: processo}}
      - id: "iss_nao_retido:total"
        arquivo: data/iss_nao_retido.json
        data_ref: gerado_em
        rotulo: "ISS declarado retido na NFS-e e pago ao prestador — total do acervo lido"
        fonte: "NFS-e dos autos SEI × OB Contabilizada do SIAFE (compliance_agent/detector_iss_retido.py)"
        nivel_prova: 2
        estado: VERIFICADO
        medidas:
          valor: {campo: totais.iss_nao_retido_verificado, unidade: BRL}
          processos: {campo: totais.processos_iss_nao_retido_verificado, unidade: contagem}
