# cores_orgaos.yaml — PALETA ÚNICA por órgão / unidade gestora (UG). Pedido do dono, 18/11/2026:
# "pinte cada órgão/unidade gestora de uma cor diferente no segundo cérebro" e "a galáxia deve reproduzir isso".
# Toda visualização (grafo do Obsidian, galáxia do painel, o que vier) pega a cor AQUI, por
# `compliance_agent/cores_orgaos.cor(<UG>)` — nunca define cor de órgão por conta própria.
#
# Regra (determinística, sem estado):
#   1. UG em `principais` → a cor de mesma posição em `paleta` (a ordem das duas listas é o contrato: não reordenar;
#      UG nova entra no FIM, cor nova entra no FIM).
#   2. Qualquer outra chave (UG fora da lista, órgão municipal por CNPJ, órgão por nome) → cor calculada do hash da
#      chave (matiz 0–359 pelo SHA-1, saturação e luminosidade em faixas que leem em fundo claro e escuro).
#      A mesma chave dá sempre a mesma cor, em qualquer máquina.
#   3. Órgão desconhecido → `indeterminado` (cinza). Nunca se chuta órgão para ganhar cor.
#
# `principais` = as 20 UGs que mais pagaram por OB no SIAFE (ob_orcamentaria_siafe, filtro de OB paga da casa
# `cruzamentos_intel._ob_paga`), medido em 18/11/2026. É ordem de ATRIBUIÇÃO de cor, não ranking publicado: não se
# atualiza quando o ranking muda (a cor de um órgão não pode mudar de um dia para o outro).
versao: 1
indeterminado: "#8A8F98"
paleta:
