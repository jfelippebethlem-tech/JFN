# slos.yaml — SLOs do estágio E18 `observar` (plano mestre v2 §3.2 E18, §3.3 fluxo.metricas, §3.10 inv. 5, §11;
# doc 2 §9 e §26). Validado por Pydantic em compliance_agent/fluxo/sensores.py (`carregar_slos`).
#
# Cada SLO julga UM sensor (o `nome` da linha em fluxo.metricas) com limites NUMÉRICOS:
#   sentido     max = o valor tem de ficar ABAIXO do limite (idade, atraso, contagem de falha)
#               min = o valor tem de ficar ACIMA do limite (disco livre, cobertura, vazão)
#   saudavel    dentro dele → SAUDAVEL
#   degradado   (opcional) entre `saudavel` e este → DEGRADADO; além dele → `pior`
#   pior        estado quando passa do último limite: DEGRADADO | ATRASADO | BLOQUEADO
#   janela_s    validade da medida: a última linha mais velha que isto é INDISPONIVEL (medida velha não é "ok" —
#               §3.10 inv. 5: visão além do SLO não está ok)
#   escopo      maquina = um estado por máquina (`nos`) · global = uma medida para o sistema (fila do PG, WAL do PG)
#   aplica_se   (opcional) o SLO só vale quando outro sensor passa de um valor; fora disso SAUDAVEL com o motivo
#   atenua_se   (opcional) teto do estado quando outro sensor, MEDIDO na janela, fica abaixo de `menor_que`
#               (sintoma sem dor: swap cheio com PSI ~0); condição sem medida ⇒ não atenua
#   decisao     (opcional) ⚖️ jurídico/contábil · 🔒 irreversível/voltado para fora: a automelhoria só escala ao dono
#   remediar    REMÉDIO DECLARADO (O8.4 consome): o que fazer quando sai do SLO. Nada aqui reinicia serviço nem mata
#               processo sozinho — o vigia antigo que agia em silêncio virou texto que a automelhoria/o dono executa.
#               CRITÉRIO FORTE (O8.4): só o texto que COMEÇA por `remediar:<nome>` com <nome> em fluxo/remedios.REMEDIOS
#               (salvaguarda própria + efeito relido pelo sensor) a automelhoria executa sozinha; o resto vai ao dono.
# Sensor que não conseguiu medir grava valor NaN + estado INDISPONIVEL (nunca 0). Estado forçado pelo próprio sensor
# (quick_check falhou, restauração falhou, painel não respondeu) prevalece se for pior que o limite.
# Limites marcados "inicial" são ponto de partida declarado, a calibrar com a série real (O1.10 / O8.4).
# Sem topologia sensível (ADR-011): nada de host, IP, porta interna ou caminho de casa.
versao: 1
slos:
  # ── máquina (cada nó) ─────────────────────────────────────────────────────────────────────────────────────────
  psi_cpu:
    sensor: psi.cpu_some
    descricao: pressão de CPU (PSI some avg60, % do tempo com tarefa esperando CPU)
    unidade: '%'
    sentido: max
    saudavel: 40
    degradado: 60
    pior: DEGRADADO
    janela_s: 1800
    escopo: maquina
    nos: [vm1, vm2, itcampo]
    dono: infra
    severidade: media
    fonte: /proc/pressure/cpu
    runbook: governador §3.4 (contido > 60)
    remediar: 'o governador já corta slots pesados; persistindo, ver o maior job do nó e o PSI por cgroup'
    origem: [governador, vm_guard, automelhoria_geral.maquinas]
  psi_mem_some:
    sensor: psi.mem_some
    descricao: pressão de memória (PSI some avg60)
    unidade: '%'
    sentido: max
    saudavel: 10
    degradado: 25
    pior: DEGRADADO
    janela_s: 1800
    escopo: maquina
    nos: [vm1, vm2, itcampo]
    dono: infra
    severidade: alta
    fonte: /proc/pressure/memory
    runbook: governador §3.4 (contido mem some > 10)
    remediar: 'conferir RSS por job (ps --sort=-rss); 1 pesado por vez; reduzir slot do recurso no nó'
    origem: [governador, vm_guard]
  psi_mem_full:
    sensor: psi.mem_full
    descricao: pressão TOTAL de memória (PSI full avg60 — todas as tarefas paradas em memória)
    unidade: '%'
    sentido: max
    saudavel: 1
    degradado: 5
    pior: BLOQUEADO
    janela_s: 1800
    escopo: maquina
    nos: [vm1, vm2, itcampo]
    dono: infra
    severidade: critica
    fonte: /proc/pressure/memory
    runbook: governador §3.4 (mem full > 5 ⇒ matar o maior job)
    remediar: 'o supervisor do fluxo mata o maior job (ação do governador, registrada em fluxo.nos); fora do fluxo: dono decide'
    decisao: '🔒'
    origem: [governador]
  psi_io_some:
    sensor: psi.io_some
    descricao: pressão de E/S (PSI some avg60) — inicial
    unidade: '%'
    sentido: max
    saudavel: 20
    degradado: 40
    pior: DEGRADADO
    janela_s: 1800
    escopo: maquina
    nos: [vm1, vm2, itcampo]
    dono: infra
    severidade: media
    fonte: /proc/pressure/io
    runbook: O8.3 disco > 85%
    remediar: 'adiar E7/E17 (disco) e VACUUM; conferir quem escreve (iotop)'
    origem: [automelhoria_geral.maquinas]
  psi_io_full:
    sensor: psi.io_full
    descricao: pressão TOTAL de E/S (PSI full avg60) — inicial
    unidade: '%'
    sentido: max
    saudavel: 5
    degradado: 20
    pior: DEGRADADO
    janela_s: 1800
    escopo: maquina
    nos: [vm1, vm2, itcampo]
    dono: infra
    severidade: alta
    fonte: /proc/pressure/io
    runbook: O8.3 disco > 85%
    remediar: 'idem psi_io_some; SQLite com VACUUM/escrita longa trava as rotas de leitura'
    origem: [vacuum-semanal-travava-coletores]
  disco_livre:
    sensor: disco.livre_pct
    descricao: espaço livre na raiz
    unidade: '%'
    sentido: min
    saudavel: 25
    degradado: 10
    pior: BLOQUEADO
    janela_s: 1800
    escopo: maquina
    nos: [vm1, vm2, itcampo]
    dono: infra
    severidade: critica
    fonte: shutil.disk_usage('/')
    runbook: O8.3 disco > 85% (§11.3 VM-2 < 75%)
    remediar: 'porta única do armazenamento (python -m compliance_agent.armazenamento guardar … / zelador); nunca rclone/rm avulso'
    decisao: '🔒'
    origem: [automelhoria_geral.vm, automelhoria_geral.plataforma, governador]
  disco_tendencia:
    sensor: disco.tendencia_pp_dia
    descricao: tendência do uso do disco (pontos percentuais por dia, regressão das últimas 72 h; + = enchendo)
    unidade: pp/dia
    sentido: max
    saudavel: 1
    degradado: 2
    pior: DEGRADADO
    janela_s: 1800
    escopo: maquina
    nos: [vm1, vm2, itcampo]
    dono: infra
    severidade: alta
    fonte: fluxo.metricas (série de disco.livre_pct do próprio nó)
    runbook: 'doc 2 §26: disco a 80% pode ser aceitável; perigoso se cresce 2% ao dia'
    remediar: 'achar quem cresce (du por pasta de data/) e mandar para a nuvem pela porta única antes de chegar ao limite'
    decisao: '🔒'
    origem: [doc2 §26]
  swap:
    sensor: swap.uso_pct
    descricao: swap em uso
    unidade: '%'
    sentido: max
    saudavel: 50
    degradado: 80
    pior: BLOQUEADO
    janela_s: 1800
    escopo: maquina
    nos: [vm1, vm2, itcampo]
    dono: infra
    severidade: alta
    fonte: /proc/meminfo
    runbook: §11.3 (swap < 50%); a VM-1 já caiu com swap 100%
    # O8.4 (pedido do dono na O8.1): swap alto com PSI de memória ~0 é página fria estacionada, não pressão —
    # DEGRADADO, não BLOQUEADO. Fontes: kernel docs accounting/psi ("some" = fração do tempo com tarefa parada
    # esperando memória — é a medida da dor); Chris Down, "In defence of swap" (2018: swap cheio de anônimas frias é
    # uso normal); systemd-oomd(8)/oomd.conf(5) (decide por PSI; SwapUsedLimit=90% é critério SEPARADO — por isso
    # DEGRADADO e não SAUDAVEL); facebookincubator/oomd (mata por pressão, não por uso). O risco do swap cheio
    # (alocação nova sem para onde ir) segue coberto por mem.disponivel_gb e psi.mem_full, que BLOQUEIAM sozinhos.
    # Limiar 1 % (avg60) = inicial: medido 24/11 na VM-1 swap 95,4 % com psi.mem_some 0,25 %.
    atenua_se: {sensor: psi.mem_some, menor_que: 1, ate: DEGRADADO}
    remediar: 'governador contém (swap > 50%); conferir vazamento do maior RSS; nunca pkill -f'
    origem: [governador, vm_guard]
  memoria_disponivel:
    sensor: mem.disponivel_gb
    descricao: memória disponível (MemAvailable)
    unidade: GB
    sentido: min
    saudavel: 2.5
    degradado: 0.7
    pior: BLOQUEADO
    janela_s: 1800
    escopo: maquina
    nos: [vm1, vm2, itcampo]
    dono: infra
    severidade: alta
    fonte: /proc/meminfo
    runbook: vm_guard (MIN_FREE_GB 2,5) + automelhoria_geral.vm (< 700 MB)
    remediar: 'não abrir navegador/OCR novo; ver o maior RSS; 1 pesado por vez'
    origem: [vm_guard, automelhoria_geral.vm]
  navegador_orfaos:
    sensor: navegador.orfaos
    descricao: processos de navegador do Playwright órfãos (pai morto), fora o navegador fixo e o chrome-jfn
    unidade: processos
    sentido: max
    saudavel: 0
    degradado: 3
    pior: DEGRADADO
    janela_s: 1800
    escopo: maquina
    nos: [vm1, vm2]
    dono: captura
    severidade: media
    fonte: tools/vm_guard._meus_chromium_pids(somente_orfaos=True)
    runbook: vm_guard (freeze de 20/06/2026)
    remediar: 'python tools/vm_guard.py (cleanup_orphans) À MÃO ou pelo job da automelhoria — o sensor não mata nada'
    origem: [vm_guard]
  # ── painel (VM-1) ─────────────────────────────────────────────────────────────────────────────────────────────
  painel_resposta:
    sensor: painel.latencia_ms
    descricao: tempo de resposta do painel (/painel na porta local); sem resposta ⇒ BLOQUEADO
    unidade: ms
    sentido: max
    saudavel: 1000
    degradado: 5000
    pior: DEGRADADO
    janela_s: 1800
    escopo: maquina
    nos: [vm1]
    dono: painel
    severidade: critica
    fonte: GET /painel (200/302/303/401 = processo vivo respondendo)
    runbook: 'painel sempre no ar (dono 13/11): sem resposta 2× seguidas = processo travado'
    remediar: 'remediar:painel_travado (python -m compliance_agent.fluxo.remedios painel_travado): restart só com 2 falhas seguidas e fora do resfriamento; o sensor não reinicia (era o painel_vigia)'
    origem: [painel_vigia, ronda, keepalive]
  painel_malformed:
    sensor: painel.rotas_malformed
    descricao: rotas de leitura do painel devolvendo "database disk image is malformed" (WAL-index morto no processo)
    unidade: rotas
    sentido: max
    saudavel: 0
    pior: BLOQUEADO
    janela_s: 5400
    escopo: maquina
    nos: [vm1]
    dono: painel
    severidade: critica
    fonte: GET em 4 rotas que leem o compliance.db (as mesmas do guardião)
    runbook: 'guardião: arquivo íntegro (quick_check ok) ⇒ restart cura; arquivo corrompido ⇒ NÃO reiniciar, perícia'
    remediar: 'remediar:painel_shm (python -m compliance_agent.fluxo.remedios painel_shm): restart SÓ se quick_check=ok, uma vez por resfriamento; corrompido ⇒ NÃO reinicia, python -m tools.reconstruir_db (dono)'
    origem: [guardiao_db_malformed]
  # ── motor de fluxo (PG, global) ───────────────────────────────────────────────────────────────────────────────
  fila_espera:
    sensor: fila.idade_max_s
    descricao: espera do job elegível mais velho na fila (now − disponivel_em)
    unidade: s
    sentido: max
    saudavel: 900
    degradado: 3600
    pior: ATRASADO
    janela_s: 1800
    escopo: global
    nos: [vm1, vm2, itcampo]
    dono: fluxo
    severidade: alta
    fonte: fluxo.jobs
    runbook: 'planejador.saude: fila elegível parada > 15 min = ATRASADO'
    remediar: 'conferir nós vivos (fluxo.nos) e se o recurso pedido existe em algum nó (BLOQUEADO)'
    origem: [pipelines_slo, planejador.saude]
  fila_backlog:
    sensor: fila.elegiveis
    descricao: jobs elegíveis na fila — inicial
    unidade: jobs
    sentido: max
    saudavel: 500
    degradado: 5000
    pior: DEGRADADO
    janela_s: 1800
    escopo: global
    nos: [vm1, vm2, itcampo]
    dono: fluxo
    severidade: media
    fonte: fluxo.jobs
    runbook: doc 2 §9 (backlog por prioridade; evitar backlog oculto)
    remediar: 'ver tipos com mais backlog (fila.idade_s.por_tipo) e a vazão por nó'
    origem: [doc2 §9]
  fila_quarentena:
    sensor: fila.quarentena
    descricao: jobs em quarentena (dead-letter)
    unidade: jobs
    sentido: max
    saudavel: 0
    degradado: 10
    pior: DEGRADADO
    janela_s: 1800
    escopo: global
    nos: [vm1, vm2, itcampo]
    dono: fluxo
    severidade: alta
    fonte: fluxo.jobs (estado = 'quarentena')
    runbook: 'quarentena = erro permanente ou tentativas esgotadas; erro_tipo + erro_resumo dizem por quê'
    remediar: 'ler erro_resumo; corrigir a causa; reabrir pelo enfileirar(reabrir) — nunca apagar a linha'
    origem: [planejador.saude]
  fila_orfaos:
    sensor: fila.orfaos
    descricao: jobs reservados com lease vencido (ninguém renovou e o planejador não recuperou)
    unidade: jobs
    sentido: max
    saudavel: 0
    pior: ATRASADO
    janela_s: 1800
    escopo: global
    nos: [vm1, vm2, itcampo]
    dono: fluxo
    severidade: alta
    fonte: fluxo.jobs (estado = 'reservado' AND prazo < now())
    runbook: 'lease vencido sem recuperação = planejador fora (advisory lock 42 sem dono)'
    remediar: 'conferir o supervisor líder; fila.recuperar_vencidos roda no ciclo do planejador'
    origem: [doc2 §9 (jobs órfãos)]
  fila_conclusao:
    sensor: fila.conclusoes_h
    descricao: jobs concluídos com efeito conferido na última hora (só vale com fila elegível)
    unidade: jobs/h
    sentido: min
    saudavel: 1
    pior: ATRASADO
    janela_s: 1800
    escopo: global
    nos: [vm1, vm2, itcampo]
    aplica_se: {sensor: fila.elegiveis, maior_que: 0}
    dono: fluxo
    severidade: alta
    fonte: fluxo.jobs (estado = 'feito' AND concluido_em > now() − 1 h)
    runbook: 'fila com trabalho e zero conclusão = motor parado ou todo job falhando o efeito'
    remediar: 'ver falhou_efeito/quarentena recentes e o heartbeat dos nós'
    origem: [doc2 §9 (taxa de conclusão)]
  nos_heartbeat:
    sensor: fluxo.nos_sem_heartbeat
    descricao: máquinas do fluxo (vm1, vm2, itcampo) sem heartbeat nos últimos 5 min
    unidade: nós
    sentido: max
    saudavel: 0
    degradado: 1
    pior: BLOQUEADO
    janela_s: 1800
    escopo: global
    nos: [vm1, vm2, itcampo]
    dono: fluxo
    severidade: alta
    fonte: fluxo.nos (heartbeat_em)
    runbook: '§3.5 modo sem it-campo: 1 nó fora = DEGRADADO (anda com vazão menor); todos fora = BLOQUEADO'
    remediar: 'systemctl --user status jfn-fluxo@<no> no nó; it-campo só reinicia com PIN presencial'
    origem: [itcampo_vigia, keepalive]
  fila_espera_p95:
    sensor: fila.espera_p95_s
    descricao: espera p95 dos jobs elegíveis na fila (now − disponivel_em); p50 e p50/p95 por tipo vão como detalhe
    unidade: s
    sentido: max
    saudavel: 600
    degradado: 3600
    pior: ATRASADO
    janela_s: 1800
    escopo: global
    nos: [vm1, vm2, itcampo]
    dono: fluxo
    severidade: media
    fonte: fluxo.jobs (percentile_cont sobre estado='fila' e disponivel_em <= now()) — inicial
    runbook: 'detalhe fila.espera_p95_s.por_tipo diz QUAL tipo espera; o máximo segue em fila_espera'
    remediar: 'conferir slots/recursos do tipo que espera (governador) e nós vivos; tipo sem nó que o rode = BLOQUEADO na fila'
    origem: [pipelines_slo, automelhoria_geral.propagacao]
  wal_pg:
    sensor: wal.pg_arquivo_atraso_s
    descricao: atraso do arquivamento contínuo de WAL do PostgreSQL (now − last_archived_time)
    unidade: s
    sentido: max
    saudavel: 900
    degradado: 3600
    pior: ATRASADO
    janela_s: 1800
    escopo: global
    nos: [vm1, vm2, itcampo]
    dono: backup
    severidade: alta
    fonte: pg_settings.archive_mode + pg_stat_archiver
    runbook: deploy/vm2/postgres/backup.md §2.4 (failed_count subindo = WAL acumulando na VM-2)
    remediar: 'conferir credencial/rede do WAL-G e o espaço do pg_wal; archive_mode=off ⇒ INDISPONIVEL até a O8.2'
    origem: [backup.md]
  # ── dados, IA e custo (VM-1: compliance.db, llm_trace.db, conferencia_opus.db moram lá) ───────────────────────
  frescor_fontes:
    sensor: frescor.fontes_atrasadas
    descricao: fontes externas ATIVA/PARCIAL com a última coleta além do SLO do contrato de ingestão
    unidade: fontes
    sentido: max
    saudavel: 0
    degradado: 3
    pior: ATRASADO
    janela_s: 10800
    escopo: maquina
    nos: [vm1]
    dono: ingestao
    severidade: alta
    fonte: config/fontes_cobertura.yaml (slo_frescor_h) + compliance_agent.ingestao.sensores.atualidade
    runbook: '§11.12 frescor 36/36; detalhe por fonte em frescor.atraso_h'
    remediar: 'comando `recuperacao` da fonte no contrato (O9.0); durante a parada de obras o atraso é esperado e declarado'
    origem: [pipelines_slo, automelhoria_geral.dados]
  visoes_frescor:
    sensor: visoes.atrasadas
    descricao: visões materializadas do painel (E15) além do SLO de frescor de cada uma, ou nunca materializadas
    unidade: visões
    sentido: max
    saudavel: 0
    degradado: 2
    pior: ATRASADO
    janela_s: 3600
    escopo: maquina
    nos: [vm1]
    dono: painel
    severidade: alta
    fonte: 'data/visoes/<visao>.meta.json (gerado_em × slo_s) — compliance_agent.aplicacao.estagios.materializar.frescor; detalhe por visão em visoes.idade_s'
    runbook: '§8 Dados e visões (O7.1): o painel só lê visões materializadas; idade de cada uma em `materializar estado`'
    remediar: '`python -m compliance_agent.aplicacao.estagios.materializar rodar --visao <visao>` (rotina materializar_painel do fluxo; inativa na parada de obras: o atraso é esperado e declarado)'
    origem: [prewarm_painel]
  llm_custo_mes:
    sensor: llm.custo_mes_usd
    descricao: gasto pago do mês (UTC) com LLM — gateway quando já grava; até lá livro-caixa da API + trace antigo
    unidade: USD
    sentido: max
    saudavel: 85
    degradado: 100
    pior: BLOQUEADO
    janela_s: 3600
    escopo: maquina
    nos: [vm1]
    dono: llm
    severidade: critica
    fonte: 'data/llm_trace.db (gateway: mesma soma de gasto_mes_usd; trace antigo: usd > 0) + data/claude_api_gasto.json (livro-caixa, só se começou no mês); teto em config/llm_politica.yaml'
    runbook: '§11.9 custo ≤ US$ 100/mês; corte de 85% = só tarefa crítica'
    remediar: 'o gateway já recusa acima do corte; conferir as tarefas mais caras no llm_trace'
    decisao: '🔒'
    origem: [automelhoria_geral.modelos, gateway orcamento_mensal]
  pericia_cobertura:
    sensor: pericia.cobertura_chars
    descricao: caracteres do acervo que a perícia integral alcança ÷ caracteres do acervo
    unidade: fração
    sentido: min
    saudavel: 0.9
    pior: DEGRADADO
    janela_s: 43200
    escopo: maquina
    nos: [vm1]
    dono: pericia
    severidade: alta
    fonte: tools/automelhoria_geral._cobertura_acervo (manifestos de data/sei_arquivo)
    runbook: '§11.9 cobertura ≥ 90% nos refeitos (linha de base 17,3%)'
    remediar: 'leitura integral (E8) dos processos cortados no teto — O6'
    origem: [automelhoria_geral.plataforma, baseline_refatoracao]
  opus_vazao:
    sensor: opus.saida_por_entrada_7d
    descricao: fila de conferência do Opus — conferidos ÷ entrados nos últimos 7 dias
    unidade: razão
    sentido: min
    saudavel: 1.0
    degradado: 0.5
    pior: ATRASADO
    janela_s: 3600
    escopo: maquina
    nos: [vm1]
    dono: llm
    severidade: alta
    fonte: data/conferencia_opus.db (fila.criado_em × fila.conferido_em)
    runbook: '§11.9 fila do Opus com saída ≥ entrada por 7 dias'
    remediar: 'cortar a entrada na origem (poda pré-despacho) ou ampliar a conferência na janela 23h–06h'
    origem: [automelhoria_geral.plataforma]
  opus_pendentes:
    sensor: opus.pendentes
    descricao: itens pendentes na fila de conferência do Opus — inicial
    unidade: itens
    sentido: max
    saudavel: 500
    degradado: 3000
    pior: ATRASADO
    janela_s: 3600
    escopo: maquina
    nos: [vm1]
    dono: llm
    severidade: media
    fonte: data/conferencia_opus.db (status = 'pendente')
    runbook: '§2 linha de base: 6.501 pendentes'
    remediar: 'idem opus_vazao'
    origem: [baseline_refatoracao]
  # ── backup, WAL e integridade (VM-1) ──────────────────────────────────────────────────────────────────────────
  backup_compliance:
    sensor: backup.compliance_idade_h
