# qualidade_inventario.yaml — INVENTÁRIO VIVO: tudo que afirma algo ao dono ou age em nome dele (regra CST-11).
#
# O código é enumerado por `compliance_agent/qualidade/inventario.py` (regex, sem rede, sem banco) e confrontado com
# este arquivo pelas catracas de `tests/test_regra_inventario.py`: superfície nova sem entrada é barrada, entrada
# morta (que não existe mais no código) também. "A DECLARAR" é dívida MEDIDA, nunca escondida — as catracas contam
# quantas restam e o número só desce (base em tests/golden/qualidade_base.json, chaves `inventario_*`).
#
# Campos
#   manchetes   afirmações em destaque do cockpit (cards `cki-*`, herói `ck-econ`, vedada `ck-ved`, frescor `ck-fontes`)
#               e os chips da mesa holográfica (`chip: nu-<id>`; o chip espelha o card de mesmo id: ckFill → nuSet).
#     id          id do elemento no DOM            superficie  onde aparece
#     afirma      o que o número diz, em 1 linha     rota        rota /api que o alimenta
#     origem      função Python que calcula          fonte       tabelas/arquivos lidos
#     natureza    pago|contratado|teto_de_ata|estimado|contagem|indice
#     esfera      estado|prefeitura|estado+prefeitura|sistema
#     consome     quem recebe a afirmação            detector    chave em config/qualidade_detectores.yaml (null = não é detector)
#     campos      caminho no JSON da rota de onde o JS tira cada número (valor|contagem|indice|…)
#     lista       caminho da lista exibida (ticker/página), quando houver
#   rotas       path → {classe: afirma|operacional, afirma: 1 linha, fonte: tabela/módulo ou A DECLARAR}
#               afirma = devolve número/achado/lista sobre terceiros ou sobre a qualidade do dado; operacional =
#               controle, saúde, SSE, missões, pausas, autocomplete, visualizador de documento.
#   abas        id → {esfera, afirma}
#   relatorios  produto entregável → {entrada, fonte_codigo (arquivo ou lista), saida, consome, gates}
#               `gates` é o que o código CHAMA (conferido por grep; a catraca re-confere por `relatorios_gate`).
#   dados_painel arquivo de dados lido por rota → {gerador: arquivo .py/.sh versionado ou A DECLARAR, rota}
#   yoda        plugins/comandos do Yoda (fora do repo, ~/.hermes/plugins/jfn-*) → {afirma, deterministico, fonte}
#   lex         peça do Lex (arquivo) → {afirma, fonte, llm, consome}
#   agendamentos o que ENTREGA algo ao dono por cron/timer → {fonte_codigo, envia, canal}
#   motores     o registro é compliance_agent/aovivo/motores.yaml (não se copia aqui)
#
# Repositório PÚBLICO: nenhum dado pessoal, nenhum nome de pessoa física.

motores: {registro: compliance_agent/aovivo/motores.yaml}

manchetes:
  - id: ck-econ
    superficie: "cockpit — número-herói (sobrepreço conferido)"
    afirma: "Soma dos indícios de sobrepreço conferidos no PNCP (≥ 2× a mediana do mesmo item na mesma unidade), fora de ata; quantidade homologada, não OB paga."
    rota: /api/comparador/economia
    origem: compliance_agent.comparador_precos.economia_potencial
    fonte: "pncp_resultado, pncp_ente (compliance.db)"
    natureza: estimado
    esfera: estado+prefeitura
    consome: ["dono (painel)", "Yoda"]
    detector: comparador.economia_potencial
    campos: {valor: economia_total, estado: por_esfera.estado.economia, prefeitura: por_esfera.prefeitura.economia,
             pendente: economia_pendente, n_pendentes: n_compras_pendentes, ata_teto: economia_ata_teto}
  - id: ck-ved
    superficie: "cockpit — caixa 'vedada' sob o herói (só aparece se > 0)"
    afirma: "Sobrepreço pago a fornecedor juridicamente vedado de contratar com aquele ente na data."
    rota: /api/comparador/vedada
    origem: compliance_agent.comparador_precos.economia_vedada
    fonte: "pncp_resultado, pncp_ente, sancoes_federais (compliance.db)"
    natureza: estimado
    esfera: estado+prefeitura
    consome: ["dono (painel)"]
    detector: comparador.economia_vedada
    campos: {valor: economia_vedada_total}
  - id: cki-radar
    chip: nu-radar
    superficie: "cockpit — card 'Radar de risco' + chip da mesa"
    afirma: "Quantos fornecedores têm sinal no radar composto (0-100) e quantos estão em nível crítico."
    rota: /api/intel/radar
    origem: compliance_agent.cruzamentos_intel.radar_risco
    fonte: "data/cache/radar_risco.json ← fantasma_score, favorecido_resumo, pncp_resultado, socios_fornecedor"
    natureza: contagem
    esfera: estado
    consome: ["dono (painel)", "Yoda"]
    detector: intel.radar_risco
    campos: {contagem: n, criticos: n_vermelho}
    lista: achados
  - id: cki-alertas
    chip: nu-alertas
    superficie: "cockpit — card 'Alertas' + chip da mesa"
    afirma: "Total de alertas NÃO descartados do motor de regras, com quantos são de gravidade alta, média e baixa (somam o total)."
    rota: /api/compliance/painel
    origem: rotas.investigacao.api_painel
    fonte: "alertas, ob_orcamentaria_siafe (compliance.db)"
    natureza: contagem
    esfera: estado
    consome: ["dono (painel)", "Yoda"]
    detector: rules.engine
    campos: {contagem: alertas.total, alta: alertas.alta, media: alertas.media, baixa: alertas.baixa}
    lista: lista_alertas
  - id: cki-fenix
    chip: nu-fenix
    superficie: "cockpit — card 'Pago a CNPJ baixado ou inapto' + chip da mesa"
    afirma: "Valor pago (OB) a CNPJs DEPOIS da baixa ou inaptidão na Receita, e quantos são — indício a conferir; ente público, cartório, filial de matriz ativa e pagamento judicial contados à parte."
    rota: /api/intel/fenix
    origem: compliance_agent.cruzamentos_intel.empresa_fenix
    fonte: "ob_orcamentaria_siafe, favorecido_resumo, empresas, estab"
    natureza: pago
    esfera: estado
    consome: ["dono (painel)", "Yoda"]
    detector: intel.empresa_fenix
    campos: {valor: total_apos_baixa, contagem: n_defunta_confirmada, contexto: n_defunta, fora: n_fora_da_manchete}
    concentracao: {lista: achados, item: valor_apos_baixa, filtro: {pagou_apos_baixa: true}}
  - id: cki-compras
    chip: nu-compras
    superficie: "cockpit — card 'Compras auditáveis' + chip da mesa"
    afirma: "Quantas compras têm indício de sobrepreço conferido no PNCP."
    rota: /api/comparador/economia
    origem: compliance_agent.comparador_precos.economia_potencial
    fonte: "pncp_resultado, pncp_ente (compliance.db)"
    natureza: contagem
    esfera: estado+prefeitura
    consome: ["dono (painel)"]
    detector: comparador.economia_potencial
    campos: {contagem: n_compras_acima_mediana}
  - id: cki-com
    chip: nu-com
    superficie: "cockpit — card 'Comunidades' + chip da mesa"
    afirma: "Quantos clusters família-empresa-órgão (Louvain) foram detectados."
    rota: /api/intel/comunidades
    origem: compliance_agent.grafo_comunidades.detectar_comunidades
    fonte: "data/cache/comunidades.json ← fantasma_score, sancoes_federais, socios_fornecedor"
    natureza: contagem
    esfera: estado
    consome: ["dono (painel)"]
    detector: intel.comunidades
    campos: {contagem: n}
  - id: cki-dossie
    chip: nu-dossie
    superficie: "cockpit — card 'Caro + suspeito' + chip da mesa"
    afirma: "Itens ≥ 3× a mediana do mesmo item com fornecedor marcado por outra fonte; quantos sancionados à época."
    rota: /api/comparador/dossie
    origem: compliance_agent.comparador_precos.caro_e_suspeito
    fonte: "pncp_resultado, pncp_ente, fantasma_score, sancoes_federais"
    natureza: contagem
    esfera: estado+prefeitura
    consome: ["dono (painel)"]
    detector: comparador.caro_e_suspeito
    campos: {contagem: n, sancionadas: n_sancionada}
    lista: achados
  - id: cki-orgao
    superficie: "cockpit — card 'Órgão que mais economiza'"
    afirma: "O órgão com maior indício de sobrepreço conferido e o valor."
    rota: /api/comparador/economia
    origem: compliance_agent.comparador_precos.economia_potencial
    fonte: "pncp_resultado, pncp_ente (compliance.db)"
    natureza: estimado
    esfera: estado+prefeitura
    consome: ["dono (painel)"]
    detector: comparador.economia_potencial
    campos: {valor: "por_orgao[0].economia", rotulo: "por_orgao[0].orgao"}
    lista: por_orgao
  - id: cki-ninho
    chip: nu-ninho
    superficie: "cockpit — card 'Ninhos de fachada' + chip da mesa 'mesma sala'"
    afirma: "Grupos na MESMA SALA com 2+ CNPJs recebendo e 3+ fatores de fachada, e o valor em OB nesses grupos."
    rota: /api/intel/ninho_sala
    origem: compliance_agent.ninho_sala.ninhos_por_sala
    fonte: "data/cache/ninho_sala.json ← estabelecimentos, favorecido_resumo"
    natureza: contagem
    esfera: estado
    consome: ["dono (painel)"]
    detector: ninho_sala
    campos: {contagem: n_alto, total: n, valor: total_recebido_ob_alto}
    lista: grupos
    concentracao: {lista: grupos, item: total_recebido_ob, filtro: {grau: alto}}
  - id: cki-lift
    superficie: "cockpit — card 'Melhor detector (lift)'"
    afirma: "O detector (circulares fora do cálculo) que marca mais fornecedores com sanção impeditiva de qualquer época ou ente acima da base, o lift e o n."
    rota: /api/intel/lift
    origem: compliance_agent.retro_auditoria.avaliar_lift
    fonte: "fantasma_score, sanções (gabarito objetivo)"
    natureza: indice
    esfera: estado
    consome: ["dono (painel)"]
    detector: retro.lift
    campos: {indice: "detectores[max lift, circular=false].lift", rotulo: "detectores[…].detector"}
    lista: detectores
  # ck-fontes saiu do cockpit em 14/11/2026 (pedido do dono): o frescor das fontes mora na aba Sistema › Motores (s_motores).

relatorios:
  fornecedor:
    entrada: "CNPJ ou nome (POST /api/relatorio/inteligencia; /relatorio do Yoda)"
    fonte_codigo: [compliance_agent/reporting/inteligencia.py, compliance_agent/reporting/intel_pdf.py]
    saida: "md + pdf + xlsx (+ parecer Lex) em reports/"
    consome: ["dono (Telegram)", "Yoda"]
    gates: [render_html]
  orgao:
    entrada: "nome/UG do órgão (POST /api/relatorio/orgao; /orgao do Yoda)"
    fonte_codigo: compliance_agent/reporting/inteligencia_orgao.py
    saida: "md + pdf"
    consome: ["dono (Telegram)", "Yoda"]
    gates: []
  dossie:
    entrada: "CNPJ (POST /api/dossie)"
    fonte_codigo: compliance_agent/dossie.py
    saida: pdf
    consome: ["dono (Telegram)"]
    gates: [garantir_neutro, render_html]
  dossie_completo:
    entrada: "CNPJ (POST /api/dossie/completo)"
    fonte_codigo: compliance_agent/dossie.py
    saida: "pdf (dossiê 360 + fachada + cláusulas + parecer)"
    consome: ["dono (Telegram)"]
    gates: [garantir_neutro, render_html]
  dossie_mestre:
    entrada: "órgão ou portfólio (POST /api/dossie/mestre)"
    fonte_codigo: compliance_agent/reporting/dossie_mestre.py
    saida: pdf
    consome: ["dono (Telegram)"]
    gates: [garantir_neutro, render_html]
  pericia_contabil:
    entrada: "rotina diária (python -m compliance_agent.pericia_contabil_rotina)"
    fonte_codigo: compliance_agent/pericia_contabil.py
    saida: "html/pdf + data/pericia_contabil_resumo.json (aba e_pcont)"
    consome: ["dono (painel)"]
    gates: [garantir_neutro_exceto_dados, render_html]
  gestao_couto:
    entrada: "rotina semanal (compliance_agent/governo_couto_regras.py)"
    fonte_codigo: [compliance_agent/governo_couto_regras.py, compliance_agent/governo_couto.py]
    saida: "data/governo_couto_suspeitas.json → GET /api/governo_couto (aba e_couto)"
    consome: ["dono (painel)"]
    gates: []
  processo_360:
    entrada: "nº do processo SEI (POST /api/processo/avaliar → tools/processo_360.py)"
    fonte_codigo: [tools/processo_360.py, compliance_agent/processo_360.py, compliance_agent/reporting/processo_360_ctx.py]
    saida: "processo_avaliacao (compliance.db) + pdf"
    consome: ["dono (painel)", "Yoda (/pareceres)"]
    gates: [render_html]
  fiscalizacao_emendas_pcrj:
    entrada: "emenda ou contrato da Prefeitura (tools/emendas_pericia.py; compliance_agent/pcrj/pericia_pcrj.py)"
    fonte_codigo: [tools/emendas_pericia.py, compliance_agent/emendas/pericia.py, compliance_agent/pcrj/pericia_pcrj.py,
                   compliance_agent/pcrj/pericia.py]
    saida: pdf
    consome: ["dono (Telegram)"]
    gates: [render_html]
  direcionamento_editais:
    entrada: "edital/órgão (tools/editais_direcionamento.py)"
    fonte_codigo: [compliance_agent/reporting/relatorio_direcionamento.py, tools/editais_direcionamento.py]
    saida: pdf
    consome: ["dono (Telegram)"]
    gates: [render_html]
  parecer_lex:
    entrada: "fornecedor (compliance_agent/lex.py; anexo do /relatorio)"
    fonte_codigo: compliance_agent/lex_render.py
    saida: "md + pdf (parecer 🟢🟡🔴)"
    consome: ["dono (Telegram)", "relatório fornecedor"]
    gates: [gate_citacoes, sanear_parecer]
  requerimento_lai:
    entrada: "processo, CNPJ ou nome (POST /api/lai/gerar)"
    fonte_codigo: compliance_agent/lai/gerar.py
    saida: "minuta de requerimento LAI"
    consome: ["dono (painel aba p_lai)", "Telegram"]
    gates: [garantir_neutro]
  intel_pdf:
    entrada: "tipo de detector (GET /api/intel/pdf)"
    fonte_codigo: compliance_agent/intel_relatorio.py
    saida: pdf
    consome: ["dono (painel)"]
    gates: [render_html]

