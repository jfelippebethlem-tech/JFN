yoda:
  capacidades: {registro: capabilities.yaml}
  plugins:
    jfn-automelhoria:
      /melhorias: {afirma: "Fila única de automelhoria (aberto/curado/REINCIDIU) de SLO, CI, catracas, serviços, ronda, SIAFE, Yoda.", deterministico: true, fonte: tools/automelhoria_geral.py}
      /pareceres: {afirma: "Fila do fiscal (Processo 360) e o que cada parecer ganhou/perdeu desde a avaliação anterior.", deterministico: true, fonte: "ranking do Processo 360 (tools/processo_360_ranking.py)"}
      /socio-sancionada: {afirma: "Contratada cujo sócio é sócio de empresa sancionada, com OB na janela de risco.", deterministico: true, fonte: /api/intel/socio_sancionada}
      /competencia-futura: {afirma: "OB SIAFE paga antes da competência que quita.", deterministico: true, fonte: /api/intel/competencia_futura}
      /dea: {afirma: "DEA (elemento 92) repetida ao mesmo fornecedor.", deterministico: true, fonte: /api/intel/dea_recorrente}
      /ordem-cronologica: {afirma: "Quebra da ordem cronológica de pagamento medida no SIAFE.", deterministico: true, fonte: /api/intel/ordem_cronologica}
      /tcu: {afirma: "Confere citação de acórdão/súmula do TCU contra o acervo local.", deterministico: true, fonte: "acervo TCU local"}
    jfn-siafe:
      /siafe: {afirma: "Grava o código MFA do SIAFE e marca a sessão livre/ocupada; devolve o estado.", deterministico: true, fonte: "arquivos de sessão lidos pelos coletores SIAFE"}
    jfn-claude:
      /claude: {afirma: "Resultado de tarefa só-leitura do Claude Code da VM.", deterministico: false, fonte: "Claude Code (assinatura)"}
      /claude-edita: {afirma: "Executa tarefa com edição pelo Claude Code (plano + confirmação).", deterministico: false, fonte: "Claude Code (assinatura)"}
      /claude-status: {afirma: "Tarefa do Claude Code em curso e a última.", deterministico: true, fonte: "estado local do plugin"}
      /claude-cancela: {afirma: "Cancela a tarefa do Claude Code.", deterministico: true, fonte: "estado local do plugin"}
      /cc: {afirma: "Liga o modo Claude Code direto (plano → ✅ → execução).", deterministico: false, fonte: "Claude Code (assinatura)"}
      /yoda: {afirma: "Desliga o modo direto (volta ao Yoda).", deterministico: true, fonte: "estado local do plugin"}
      /cc-nova: {afirma: "Abre sessão nova do Claude Code.", deterministico: true, fonte: "estado local do plugin"}
      /cc-para: {afirma: "Interrompe o Claude Code.", deterministico: true, fonte: "estado local do plugin"}
      /cc-status: {afirma: "Estado do modo direto.", deterministico: true, fonte: "estado local do plugin"}
      /cc-desfaz: {afirma: "Desfaz a última execução do Claude Code (escopado).", deterministico: true, fonte: "jfn-claude/desfaz.py"}
    jfn-guardas:
      hook pre_tool_call: {afirma: "Veta ferramentas de escrita/execução do Yoda e write_file em documentos só-acréscimo.", deterministico: true, fonte: "regras do plugin"}

lex:
  compliance_agent/lex.py: {afirma: "Parecer fático-jurídico (tomada de contas) sobre contratação/licitação/pagamentos de um fornecedor.", fonte: "compliance.db + texto SEI", llm: true, consome: ["relatório fornecedor", "dono (Telegram)"]}
  compliance_agent/lex_analise_conteudo.py: {afirma: "Análise de conteúdo do SEI, contratos TCE-RJ e OB com LLM discursivo.", fonte: "texto SEI, contratos TCE-RJ, OB", llm: true, consome: ["parecer Lex"]}
  compliance_agent/lex_redflags.py: {afirma: "Catálogo estático de red flags e grau 🟢🟡🔴.", fonte: "conhecimento estático (sem I/O)", llm: false, consome: ["parecer Lex"]}
  compliance_agent/lex_sancoes.py: {afirma: "Dosimetria de sanções administrativas (manual PGE-RJ).", fonte: "manual PGE-RJ codificado", llm: false, consome: ["parecer Lex"]}
  compliance_agent/lex_forense.py: {afirma: "Análise forense quantitativa das OBs do alvo.", fonte: "OB (compliance.db)", llm: false, consome: ["parecer Lex"]}
  compliance_agent/lex_conflito.py: {afirma: "Conflito de interesse: doações TSE × fornecedores (OB/QSA).", fonte: "TSE dados abertos, OB, QSA", llm: false, consome: ["parecer Lex", "/api/conflito"]}
  compliance_agent/lex_base_empirica.py: {afirma: "Padrões empíricos da base (OB, scores) para calibrar o parecer.", fonte: compliance.db, llm: false, consome: ["parecer Lex"]}
  compliance_agent/lex_render.py: {afirma: "Render do parecer de fornecedor (mérito, seções, md e pdf).", fonte: "contexto do Lex", llm: true, consome: ["dono (Telegram)"]}
  compliance_agent/lex_orgao.py: {afirma: "Parecer de órgão (UG): achados de nível órgão.", fonte: compliance.db, llm: false, consome: ["relatório órgão"]}
  tools/lex_execucao.py: {afirma: "Avalia a execução do contrato a partir do processo SEI de pagamento.", fonte: "processo SEI arquivado", llm: true, consome: ["Processo 360", "perícia"]}
