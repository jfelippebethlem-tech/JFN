# Regras novas para o LOTE do dono (§3.10 item 4). `decisao`: pendente | aprovada | recusada (as duas últimas exigem dono).
propostas:
  - id: O66-P1
    titulo: "Adotar a régua por par (este arquivo) como CHECAGEM do rótulo — sem mudar roteamento"
    dono: null
    data: "2026-11-24"
    decisao: pendente
    motivo: >-
      Nenhum par em uso cumpre (a): não existe ouro congelado de juízo de LLM, e toda origem de par é a fila por
      prioridade (não sorteio). Com a régua ligada, TODO juízo de IA sai "NÃO JULGADO — proposta de <modelo>" — que é
      o estado honesto de hoje. Gateway (extras.regua), E11 (release_ia) e E12 já leem; nada muda de camada.
    evidencia: {relatorio: "~/vault/refatoracao/o66-regua.md §2", testes: tests/test_regua_confiabilidade.py}

  - id: O66-P2
    titulo: "Conferente intermediário Sonnet no E12 (JFN_CONFERENTE_SONNET=1), só na perícia de execução"
    dono: null
    data: "2026-11-24"
    decisao: pendente
    motivo: >-
      Simulado com a O6.5 (779/dia, 49,1% retidos, 47–71 Opus/dia): o Sonnet SOZINHO não fecha a vazão (9–24%
      contra 12–19% só com o Opus) — a perícia integral é 85% da demanda (158 retidos/dia × 210 s) e o Sonnet nela
      leva 225 s. Com a integral cortada na origem (E11 só pela assinatura não entra na fila), o Opus sozinho fecha
      81–100% e Sonnet (modo grave, peso ≤ 0,5) + Opus fecham 100% já com 47/dia. Exige medir o peso do Sonnet na
      cota (O66-P5) e o par R-CONF-SONNET aprovado para o fechado-pelo-Sonnet sair da pendência.
    evidencia: {relatorio: "~/vault/refatoracao/o66-regua.md §3", simulacao: "python -m compliance_agent.llm.conferente_sonnet simular --proposta data/conferencia_risco_proposta.json"}

  - id: O66-P3
    titulo: "FP medida > 50% vai ao Tier 3 (hoje vai ao Tier 2 como 'medido e reprovado')"
    dono: null
    data: "2026-11-24"
    decisao: pendente
    motivo: >-
      Muda 4 detectores do registro gravado (intel.aditivos_estouro 169/169, pcrj.d11_aditivo_estourado 28/28,
      intel.radar_risco 24/26, ninho_sala 5/5 — nenhum de manchete) e, quando a sombra da O5.4 for gravada, mais 2 de
      manchete (rules.ob_fracionamento 43/43, rules.ob_favorecido_doerj_cruzado 4/5): 6 no total. Variante pelo IC95
      inferior > 50% (só o que é FP com certeza estatística): 5 — sai o doerj_cruzado (IC 37,6%–96,4%).
    evidencia: {relatorio: "~/vault/refatoracao/o66-regua.md §4", fonte: "config/qualidade_detectores.yaml; ~/vault/refatoracao/o54-calibracao.md §2"}

  - id: O66-P4
    titulo: "Ouro de juízo por tarefa: 125 itens SORTEADOS e estratificados (processo × órgão × ano), congelados"
    dono: null
    data: "2026-11-24"
    decisao: pendente
    motivo: >-
      Sem isso (a) é inalcançável para qualquer par. Fonte: a amostra 1/8 + cota do E12 (motivo gravado em `risco`),
      rótulo = Opus para os modelos de baixo e 2º revisor humano para o próprio Opus; congelar com ouro.congelar.
      Custo: ~125 conferências do Opus por tarefa (≈ 2–3 dias da cota de conferência), só fora do ritmo contido.
    evidencia: {fonte: "compliance_agent/qualidade/ouro.py; plano §3.10"}

  - id: O66-P5
    titulo: "Medir o peso do Sonnet na cota semanal antes de ligar o conferente"
    dono: null
    data: "2026-11-24"
    decisao: pendente
    motivo: >-
      INDISPONÍVEL hoje: a bancada de 23/11 (00:20–02:35) moveu a semana de 20% para 23% com Sonnet, Opus e a própria
      sessão juntos — resolução de 1 ponto e uso misturado. Proposta: no sábado 28/11 após 19h (janela nova), 30
      chamadas Sonnet isoladas da execução, leitura do % antes/depois. A simulação usa peso 1,0 / 0,5 / 0,2.
    evidencia: {fonte: "data/claude_assinatura_uso.jsonl (23/11 00:20–03:00)"}
