# Régua de confiabilidade por PAR tarefa × modelo × prompt_version × release_ia — plano mestre v2 §3.10 (O6.6).
#
# Quem lê: compliance_agent/qualidade/regua.py (carregador + validador). Quem decide: o DONO, em LOTE (§3.10 item 4).
# O validador RECALCULA (a)–(d) a partir da `evidencia` (o Wilson é refeito, não lido daqui): um APROVADO_DONO cuja
# evidência não fecha derruba a carga inteira (falha-fechado: nada aparece como julgado).
#
# Estados: NAO_JULGADO (padrão) → EM_SOMBRA ((a), (b), (d) cumpridos; sombra (c) correndo) → APROVADO_DONO
# ((a)–(d) + dono; prompt_version e release_ia EXATOS) → REBAIXADO (1º erro grave na amostra contínua do Opus, 1/8).
# `"*"` = qualquer versão: serve para registrar o estado de um par em uso, NUNCA para aprovar.
# Evidência: `ouro` (congelado por qualidade/ouro.congelar: n, graves, sha256, estratificado, estratos), `sombra`
# (dias, n, graves), `portoes` (citacao, numero_fonte, schema_estrito, abstencao: true só com teste/medição citada) e
# `medido` (o que JÁ existe, sem ouro: pares contra o Opus — informativo, não conta para (a)).
# Grave = 🔴×⚪ (|nível − referência| ≥ 2), número inventado, citação inexistente ou identidade trocada (§3.10).
# Unidade = ITEM (eixos do mesmo processo não são independentes). Avaliação: `python -m compliance_agent.qualidade.regua
# avaliar --bancada ~/.local/state/jfn-bancada-regua-sonnet-20261123/res` (só leitura, sem LLM) — 24/11/2026.

versao: 1
atualizado_em: "2026-11-24"

criterios:            # os números do §3.10 — o validador recusa divergência (mudar aqui = mudar o plano)
  ouro_n_min: 125     # com 0 grave, 125 é o 1º n cujo IC95 sup. de Wilson fica ≤ 3% (2,98%; com 124 dá 3,005%)
  ic95_grave_max: 0.03
  sombra_dias_min: 14
  sombra_n_min: 30

