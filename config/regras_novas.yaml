    data: "2026-11-24"
    motivo: >-
      E11 (laudo v2) pela assinatura. O Opus é o gabarito dos demais: não há referência independente — o ouro dele é
      HUMANO (2º revisor, ouro.estado_revisao_tier1). Laudos antigos do Claude tinham 14,7% de citações inexistentes
      (O6.4): o portão de citação do E11 é obrigatório e está implementado, mas a paridade de juízo não rodou.
    evidencia:
      ouro: null
      sombra: null
