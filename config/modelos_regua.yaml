# Régua do Sonnet por tarefa — o piso contra o qual a automelhoria compara os modelos grátis e fracos.
#
# Regra do dono (20/11/2026, `bancada-free-vs-sonnet`): modelo grátis só fica numa tarefa se acerta >= Sonnet (ambos
# julgados pelo Opus) e sem erro grave. O loop (`tools/automelhoria_modelos.py`) REBAIXA na cadeia da tarefa o modelo
# cuja divergência GRAVE do Opus mediu acima da do Sonnet NA MESMA TAREFA — e só com régua medida: sem entrada aqui
# (e sem pares Sonnet × Opus no mesmo item em `data/cruzamento_motores.db`), não rebaixa, só abre o item
# `sem_regua_sonnet` pedindo a bancada.
#
# Cada entrada é um número MEDIDO na bancada (mesma tarefa, mesma régua de "grave" = um 🔴 contra um ⚪):
#   <tarefa>: {taxa_grave: 0.04, n: 100, fonte: "bancada AAAA-MM-DD, <onde está o resultado>"}
# 23/11/2026: bancada ~/.local/state/jfn-bancada-regua-sonnet-20261123/ (bancada.py, analisar.py, res/*.jsonl). Sonnet 5.5
# pela assinatura (claude -p, sem --bare), MESMA entrada e MESMO sistema do Opus, normalizador da própria tarefa:
#   · triagem_alertas — gabarito = leitura do Opus já gravada no cruzamento (prompt vigente desde 14/11), prompt remontado
#     do alerta; a citação passa pela mesma conferência (`triagem_alertas._conferir`);
#   · pericia_integral — gabarito = resposta do Opus da fila de conferência; a entrada exata veio do backup de 18/11
#     (`data/backups/conferencia_opus_antes_siafe_limpo_20261118.db`); pares = grau global + eixos após a conferência
#     literal (`pericia_integral.interpretar`), como o cruzamento grava; eixos do mesmo processo não são independentes;
#   · pericia_execucao — a fila apaga a entrada ao conferir: Opus E Sonnet novos na mesma entrada pendente (amostra
#     aleatória, semente 20261123).
# Zero grave nas três: o IC95 superior (Wilson) é o que a amostra permite afirmar — o sensor compara a taxa pontual.
referencia_sonnet:
  triagem_alertas: {taxa_grave: 0.0, n: 54, graves: 0, ic95: [0.0, 0.0664], concordancia_exata: 0.852,
                    fonte: "bancada 2026-11-23, ~/.local/state/jfn-bancada-regua-sonnet-20261123/res/triagem_alertas.jsonl"}
  pericia_execucao: {taxa_grave: 0.0, n: 50, graves: 0, ic95: [0.0, 0.0714], concordancia_exata: 0.74,
                     fonte: "bancada 2026-11-23, ~/.local/state/jfn-bancada-regua-sonnet-20261123/res/pericia_execucao.jsonl"}
  pericia_integral: {taxa_grave: 0.0, n: 82, graves: 0, ic95: [0.0, 0.0448], processos: 12, concordancia_exata: 0.866,
                     fonte: "bancada 2026-11-23, ~/.local/state/jfn-bancada-regua-sonnet-20261123/res/pericia_integral.jsonl"}

# Bancadas de COLETA (régua por campo, por código contra o texto — não é a régua por nível da perícia acima). Lido por
# `tools/automelhoria_modelos.avaliar_ficha_gratis`: cada categoria com grave > 0 vira item `ficha_gratis_grave:*` na
# fila da automelhoria até uma bancada nova medir zero.
bancadas_coleta:
  ficha_gratis:
    tarefa: extracao_sei (tools/sei_ficha_acervo — ficha do acervo SEI)
    modelo: "gemini-3.5-flash-lite+particle-ai/particle-1:free"
    arranjo: "consenso: os dois respondem sem grave → união dos itens conferidos; senão o Haiku faz o processo"
    n: 103
    fonte: "bancada 2026-11-22, ~/.local/state/jfn-bancada-ficha-20261122/ (analisar.py, bootstrap2.py)"
    medido:
      cobertura_por_processo: {arranjo: 0.824, haiku: 0.752, dif_ic95: [0.038, 0.107]}
      melhor_x_pior_que_haiku: "51×21 (31 empates)"
      graves_por_100_itens: {arranjo: 0.24, haiku: 1.07, dif_ic95: [-0.0115, -0.0053]}
      residuais_que_a_conferencia_nao_pega: {arranjo: 3, haiku: 14}
      processos_feitos_pelo_gratis: 0.728
      sozinhos_nao_passam: "flash-lite 65,0% × Haiku 78,5% (n=200); particle 72,7% × 75,2% (n=103); 3.1/2.5-flash-lite piores"
    graves:          # graves BRUTOS na bancada (flash-lite em 200 processos, particle em 103; o processo foi ao Haiku)
      valores: 12
      datas: 13
      cnpjs: 10
      documentos: 8
      fundamento_legal: 5
      resumo: 7
      ponto: 4
