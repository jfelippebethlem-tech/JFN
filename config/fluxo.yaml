# ── ENCADEAMENTO DOS ESTÁGIOS NATIVOS (revisão de falhas caladas 25/11, achado 1.1) ───────────────────────────────
# O handler nativo emite a FONTE CURTA (arvore, capturar, texto…), não o id de rotina: a chave aqui é 'fonte/tipo'.
# Fonte única: este bloco + compliance_agent/fluxo/grafo.py (formas). O boot (grafo.carregar) recusa evento emitido
# sem rota, terminal ou dívida declarada; a catraca tests/test_fluxo_encadeamento.py confere `emite` contra o código
# dos handlers. Evento sem consumidor NÃO é marcado processado: fica pendente e a saúde mostra BLOQUEADO.
nativos:
  emite:
    E2: [arvore/documento_novo, sei_relacionado/citado]
    E3: [capturar/versao_nova]
    E4: [texto/texto_novo, texto/pagina_escaneada, texto/sem_ocr, texto/invalido]
    E5: [ocr/texto_novo, ocr/numero_ia, ocr/terminado]
    E6: [confirmar_ocr/confirmado, confirmar_ocr/a_conferir]
    E7: [arquivar/arquivado]
    E8: [fatos/mudou]
    E9: [elegibilidade/mudou]
    E10: [detectar/achados, detectar/achado_processo]
    E11: [periciar/laudo]
    E12: [conferir/veredito]
    E13: [calibrar/tier]
    E14: [caso/versao]
    E15: [materializar/visao]
    E16: [entregar/dossie]
    E18: [observar/metricas]
  rotas:
    # E1 ainda não é nativo (o coletor é legado); o contrato do evento dele já fica declarado (o ensaio O8.5 o emite)
    - {evento: coleta/ob_nova, estagio: E2, forma: processo}
    - {evento: coleta/fonte_mudou, estagio: E9, forma: unidade}
    - {evento: arvore/documento_novo, estagio: E3, forma: processo}
    - {evento: capturar/versao_nova, estagio: E4, forma: aquisicao, nota: um texto por versão binária da aquisição}
    - {evento: texto/pagina_escaneada, estagio: E5, forma: documento}
    - {evento: texto/sem_ocr, estagio: E7, forma: documento}
    - {evento: texto/texto_novo, estagio: E8, forma: processo, debounce_s: 120, nota: junta os documentos do processo}
    - {evento: ocr/numero_ia, estagio: E6, forma: documento}
    - {evento: ocr/terminado, estagio: E7, forma: documento}
    - {evento: ocr/texto_novo, estagio: E8, forma: processo, debounce_s: 120}
    - {evento: confirmar_ocr/confirmado, estagio: E8, forma: processo, debounce_s: 120}
    - {evento: confirmar_ocr/a_conferir, estagio: E8, forma: processo, debounce_s: 120}
    - {evento: fatos/mudou, estagio: E11, forma: processo}
    - {evento: elegibilidade/mudou, estagio: E10, forma: detectores, nota: um detectar por detector cuja exigência é da unidade}
    - {evento: detectar/achado_processo, estagio: E11, forma: processo}
    - {evento: periciar/laudo, estagio: E12, forma: laudo}
    - {evento: conferir/veredito, estagio: E13, forma: agrupado}
    - {evento: coleta/conferidos, estagio: E13, forma: agrupado, nota: veredito novo da triagem/Opus coletado pelo E1}
    - {evento: coleta/fonte_mudou, estagio: E15, forma: fixo, chave: siafe_stats, payload: {visao: siafe_stats},
       nota: 'a visão do painel que lê a OB do SIAFE (as demais visões ainda são do materializador legado)'}
    - {evento: detectar/achados, estagio: E12, forma: achados, nota: 'um conferir por achado da rodada; o E12 decide por risco'}
    - {evento: detectar/achados, estagio: E14, forma: casos, nota: 'caso por processo/CNPJ citado nos achados da rodada'}
    - {evento: caso/versao, estagio: E16, forma: fixo, chave: 'dossie_orgao:couto', debounce_s: 600,
       payload: {produto: dossie_orgao, lente: couto, justificativa: 'esteira: caso novo ou versão nova (E14 → E16)'},
       nota: 'foco do dono no período Couto (memória foco-50-governo-couto); SEM envio: `enviar` ausente = não manda Telegram'}
    - {evento: sei_relacionado/citado, estagio: E2, forma: citado, max_profundidade: 1,
       nota: 'árvore do processo citado por um processo com OB; o citado do citado para (não varre o SEI inteiro)'}
    - {evento: texto/invalido, estagio: E2, forma: processo, max_reaberturas: 3,
       nota: 'tela de WAF/menu no lugar do PDF: o E2 trata a versão inválida como faltante (O3.5, 1.8) e o E3 recaptura; 3× em 24 h = laço, descartado'}
  terminais:
    arquivar/arquivado: 'original guardado com md5 conferido: nenhum estágio depende'
    calibrar/tier: 'o tier calibrado é configuração que o E10 lê (não é aresta: senão haveria ciclo E10→E13→E10)'
    materializar/visao: 'visão pronta: a rota do painel só lê'
    entregar/dossie: 'dossiê exportado: fim da cadeia'
    observar/metricas: 'métrica gravada em fluxo.metricas; a automelhoria (O8.4) lê a tabela, não o evento'
    eco/concluido: 'E0 de teste do motor'
  sem_consumidor: {}
  # estágios sem evento de entrada: horário. Entram DESLIGADOS na agenda do PG (religar é a O9.0, uma a uma)
  agenda:
    - {id: e17_backup_compliance, estagio: E17, cron: '50 3 * * *', payload: {rotina: backup_compliance, simular: true},
       nota: 'sombra da rotina legada backup_compliance: simula e confere pré-condições; executar = decisão da O9.0'}
    - {id: e17_backup_evidencias_pg, estagio: E17, cron: '40 2 * * *', payload: {rotina: backup_evidencias_pg, simular: true}}
    - {id: e17_wal_checkpoint, estagio: E17, cron: '25 */6 * * *', payload: {rotina: wal_checkpoint, simular: true}}
    - {id: e17_vacuum, estagio: E17, cron: '0 3 * * 0', payload: {rotina: vacuum, simular: true}}
    - {id: e17_zelador, estagio: E17, cron: '30 2 1-7 * *', payload: {rotina: zelador, simular: true}}
    - {id: e18_observar_vm1, estagio: E18, cron: '*/10 * * * *', payload: {nos: [vm1]},
       nota: 'sensores do nó → fluxo.metricas; nativo no lugar das legadas observar_<nó> (desligadas)'}
    - {id: e18_observar_vm2, estagio: E18, cron: '3-59/10 * * * *', payload: {nos: [vm2]}}
    - {id: e18_observar_itcampo, estagio: E18, cron: '6-59/10 * * * *', payload: {nos: [itcampo]}}
