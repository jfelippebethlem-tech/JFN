    nota: 'Religada na O9.0 (25/11/2026). Era o bloqueio da parada: «parada de obras (24/11/2026): religa na O9.0. Até lá as visões só são regravadas à mão (`materializar rodar --todas`) e o sensor visoes.atrasadas declara o atraso; as rotas migradas servem a última visão (cabeçalho X-JFN-Visao-Gerado-Em) e, sem visão, caem no cálculo legado (X-JFN-Visao: ausente)». O7.1. Cada passo é o estágio nativo `materializar` pela CLI (handler + efeito no mesmo processo; a linha de prova só sai depois de conferir sha256 do corpo no disco = meta = declarado e o universo recontado). Quando o grafo agendar tipo nativo, cada passo vira um job `materializar:<visao>` sujo pelas fontes da visão (VISOES[...].fontes). O cálculo é pesado (conflito ~24–200 s): na VM-1 porque o compliance.db mora lá; volta VM-2 só com o snapshot conferido'
