# fluxo.yaml — o GRAFO da Esteira Única (plano mestre v2 §3.2/§3.3, item O2.1). Validado por Pydantic no carregamento
# (compliance_agent/fluxo/grafo.py; ciclo de dependência ⇒ erro). Conferir: `python -m compliance_agent.fluxo.grafo`.
#
# Gerado UMA vez (24/11/2026) de config/propagacao.yaml (fontes + 43 derivados) e do inventário O1.1 (config/jobs.yaml,
# gitignored: só os jobs ativos/rede ANTES da parada) — daqui em diante este arquivo é a fonte, editado à mão.
# SEM topologia sensível (ADR-011): nós só vm1/vm2/itcampo; comandos relativos à raiz do repo; nada de host, IP,
# diretório de casa ou credencial (o validador recusa caminho de casa no argv; `.env` só entra por `carregar_env`).
#
#   estagios      E1–E18: recursos (= slots do governador), nós, volta (máquina alternativa), timeout_s, prioridade
#                 (menor = antes), efeito (descrição verificável), concorrência por fonte/provedor, dependência.
#                 E13 → E10 NÃO é aresta: o tier calibrado é configuração que o E10 lê (senão haveria ciclo).
#   concorrencia  teto GLOBAL por fonte/provedor (todas as máquinas), aplicado na RESERVA (fila.reservar, O2.2);
#                 `por_fonte` vale por rotina (etiqueta por_fonte:<rotina>). `ritmo` = guarda da assinatura.
#   fontes        nomes de evento (a sonda ainda mora no propagacao.yaml até a O3).
#   rotinas       o que rodava, pelo estágio `legado` (comando atual, sem reescrever): agenda (cron 5 campos, hora de
#                 Brasília; args por horário) e/ou evento (depende, debounce_s, intervalo_min_s, agrupar). `{py}` =
#                 python do venv; `{hoje}`/`{ontem}` = datas de Brasília. efeito: rc 0 de todos os passos E `arquivo`
#                 regravado / `log_contem` / `log_sem` (padrão: traceback); `so_rc` = dívida declarada.
#   duplicacoes   escolhas feitas sobre as 29 duplicações do inventário (uma entrada só).
#   fora          o que NÃO entra na esteira, com o motivo.
versao: 1
nos: [vm1, vm2, itcampo]
concorrencia:
  por_fonte: {max: 1, motivo: 'uma coleta por fonte externa ao mesmo tempo (circuit breaker por fonte, §3.4)'}
  siafe_sessao: {max: 1, motivo: 'uma sessão SIAFE por vez; na VM-2, SEI ou SIAFE, nunca os dois (memória vm2-sweeps-e-siafe-sessao-unica)'}
  sei_rj_ip: {max: 6, motivo: 'teto do SEI-RJ por IP, medido (§3.4 it-campo navegador 6)'}
  doerj: {max: 1, motivo: uma leitura do Diário Oficial por vez}
  pncp: {max: 1, motivo: 'API PNCP: uma coleta por vez (limite de taxa)'}
  tcerj: {max: 1, motivo: 'portal aberto do TCE-RJ: uma coleta por vez'}
  receita_cadastro: {max: 1, motivo: 'consulta cadastral (dump/sweep de empresas): uma por vez'}
  assinatura_claude: {max: 4, motivo: 'CLI da assinatura (it-campo 4 + VM-2), com a trava de ritmo semanal (llm/ritmo_assinatura)'}
  llm_batch: {max: 2, motivo: lotes Batch (Haiku) em voo ao mesmo tempo}
  api_paga: {max: 1, motivo: 'API paga com teto de US$ 100/mês: um consumidor por vez (nunca assumir free tier)'}
  painel: {max: 1, motivo: 'recálculo do cache do painel: um pedido por vez (o painel entrega o anterior e recalcula em 2º plano)'}
  disco_vm1: {max: 1, motivo: 'uma rotina de disco pesada por vez na VM-1 (WAL, backup, compactação)'}
# Slot TRANSITÓRIO (decisão D1 do dono, 24/11/2026): a §3.4 dá 0 navegador à VM-1, mas 15 rotinas legadas de navegador
# estão presas ao compliance.db (que mora na VM-1) até o E1–E3 sair dela. 1 slot de navegador na VM-1 SÓ para estas 15,
# até a O3.3. A reserva recusa o slot a qualquer outro tipo (fila.reservar `restritos`) e a catraca
# tests/test_fluxo_o23.py impede a lista de crescer ou o transitório de mudar de nó/recurso. Sombra §8.5/§8.6.
transitorios:
  navegador_vm1:
    maquina: vm1
    recurso: navegador
    slots: 1
    transitorio_ate: O3.3
    motivo: 'rotinas legadas de navegador presas ao compliance.db da VM-1 (sombra §8.6, decisão 1-a); sai quando o E1–E3 for portado'
    rotinas: [siafe_runner_diario, siafe_runner_retentar, siafe_drenar_capados, siafe_documento_sweep, sweep_sei, sweep_dados,
      sei_integra_fila, integra_fila_dinheiro, varredura_sei_lane, sweep_integra_contratos_pcrj, doerj, pcrj_sei_busca_termos,
      sei_busca_credor, verificacao_humana_manter, sweep_sei_noturno]
estagios:
  E1:
    tipo: coletar
    nome: Coletar fonte
    recursos: [cpu_leve]
    nos: [vm2, vm1]
    volta:
      nos: [vm1]
      nota: navegador SIAFE só na VM-2; VM-1 só em emergência
    timeout_s: 3600
    prioridade: 40
    efeito: linhas novas + registro em aquisicao com contagens aceito/rejeitado/quarentena, ou 'sem novidade' declarado
    concorrencia: [por_fonte]
    depende: []
    sem_itcampo: igual
  E2:
    tipo: arvore
    nome: Árvore do processo SEI
    recursos: [navegador]
    nos: [itcampo, vm2]
    volta:
      nos: [vm2, vm1]
      nota: VM-2 ×1; VM-1 ×1 só em emergência
    timeout_s: 3600
    prioridade: 50
    efeito: árvore + tree_hash gravados; hash igual ao anterior = 'sem mudança' declarado e fim
    concorrencia: [sei_rj_ip]
    depende: [E1]
    sem_itcampo: VM-2 ×1
  E3:
    tipo: capturar
    nome: Capturar documentos novos
    recursos: [navegador]
    nos: [itcampo, vm2]
    volta:
      nos: [vm2]
    timeout_s: 3600
    prioridade: 50
    efeito: só os documentos novos (delta por id_documento) + versoes sha256; conferência por marcador com 0 omitido
    concorrencia: [sei_rj_ip]
    depende: [E2]
    sem_itcampo: VM-2
  E4:
    tipo: texto
    nome: Texto nativo
    recursos: [cpu_leve]
    nos: [vm2, vm1]
    volta:
      nos: [vm1]
    timeout_s: 1800
    prioridade: 60
    efeito: texto nativo por página + perfil (nativa/escaneada/branca) + registro de transformacao
    depende: [E3]
    sem_itcampo: VM-2 e VM-1
  E5:
    tipo: ocr
    nome: OCR de página escaneada
    recursos: [gpu]
    nos: [itcampo]
    volta:
      nos: [vm2]
      recursos: [cpu_pesado]
      nota: 'CPU (RapidOCR/Tesseract) na VM-2: mais lento, nunca parado (~19 PDFs/dia, §16.1); a VM-2 não tem slot gpu'
    timeout_s: 7200
    prioridade: 55
    efeito: OCR gravado SÓ onde o texto estava vazio, com bbox e motor@versão
    depende: [E4]
    sem_itcampo: CPU na VM-2
  E6:
    tipo: confirmar_ocr
    nome: Confirmar número do OCR
    recursos: [cpu_leve]
    nos: [vm2]
    volta:
      nos: [vm1]
    timeout_s: 3600
    prioridade: 60
    efeito: 'número do OCR por IA confirmado (nível A: SIAFE, código de barras ou leitura independente) ou marcado a_conferir'
    depende: [E5]
    sem_itcampo: VM-2
  E7:
    tipo: arquivar
    nome: Arquivar original
    recursos: [disco]
    nos: [vm2, itcampo]
    volta:
      nos: [vm2]
      nota: fica quente na VM-2 (com quota) até o HD voltar
    timeout_s: 3600
    prioridade: 80
    efeito: original no HD/frio com md5 conferido + índice atualizado; espaço liberado medido
    depende: [E5]
    sem_itcampo: quente na VM-2
  E8:
    tipo: fatos
    nome: Fatos do processo
    recursos: [llm]
    nos: [vm2, itcampo]
    volta:
      nos: [vm2]
    timeout_s: 3600
    prioridade: 45
    efeito: fatos com citação literal conferida (documento, versão, página, offset) + cobertura gravada
    concorrencia: [assinatura_claude, llm_batch]
    depende: [E4, E6]
    ritmo: leitura_integral               # a tarefa do handler (TAREFA): a reserva segura o job com a porta fechada
    sem_itcampo: VM-2
  E9:
    tipo: elegibilidade
    nome: Elegibilidade da contratação
    recursos: [cpu_leve]
    nos: [vm2]
    volta:
      nos: [vm1]
    timeout_s: 3600
    prioridade: 40
    efeito: regime, natureza do pagamento, origem do exercício, natureza do credor e elegibilidade por detector gravados
    depende: [E1, E8]
    sem_itcampo: igual
  E10:
    tipo: detectar
    nome: Detectar
    recursos: [cpu_pesado]
    nos: [vm2, itcampo]
    volta:
      nos: [vm2]
    timeout_s: 3600
    prioridade: 45
    efeito: execucao_regra registrada + achados no contrato único (ou 0 achado declarado)
    depende: [E9]
    sem_itcampo: VM-2
  E11:
    tipo: periciar
    nome: Periciar processo
    recursos: [llm]
    nos: [vm2, itcampo]
    volta:
      nos: [vm2]
    timeout_s: 3600
    prioridade: 45
    efeito: laudo v2 por eixo com release_ia, cobertura e abstenção gravados
    concorrencia: [assinatura_claude, llm_batch]
    depende: [E8, E10]
    ritmo: pericia_integral               # a tarefa do handler (TAREFA): a reserva segura o job com a porta fechada
    espera_montante: true          # espera o E8/E10 (E12: E10/E11) rodando ou pronto: um juízo por processo
    sem_itcampo: VM-2
  E12:
    tipo: conferir
    nome: Conferir (Opus)
    recursos: [llm]
    nos: [vm2, itcampo]
    volta:
      nos: [vm2]
    timeout_s: 3600
    prioridade: 30
    efeito: veredito do Opus gravado (confirma ou rebaixa) com a régua atualizada
    concorrencia: [assinatura_claude]
    depende: [E10, E11]
    ritmo: conferencia_e12               # a tarefa do handler (TAREFA): a reserva segura o job com a porta fechada
    espera_montante: true          # espera o E8/E10 (E12: E10/E11) rodando ou pronto: um juízo por processo
    sem_itcampo: VM-2
  E13:
    tipo: calibrar
    nome: Calibrar detector
    recursos: [cpu_leve]
    nos: [vm2]
    volta:
      nos: [vm1]
    timeout_s: 3600
    prioridade: 70
    efeito: fp_medida + IC95 + tier gravados no registro do detector
    depende: [E12]
    sem_itcampo: VM-2
  E14:
    tipo: caso
    nome: Montar caso
    recursos: [cpu_leve]
    nos: [vm2, vm1]
    volta:
      nos: [vm1]
    timeout_s: 3600
    prioridade: 60
    efeito: caso gravado com hipóteses inocentes, lacunas e contestações
    depende: [E10, E11, E12]
    sem_itcampo: VM-2
  E15:
    tipo: materializar
    nome: Materializar visão
    recursos: [materializar]
    nos: [vm1]
    volta:
      nos: [vm2]
      recursos: [cpu_leve]
      nota: só se a VM-1 cair; o painel mora na VM-1 (a VM-2 não tem slot materializar)
    timeout_s: 1800
    prioridade: 20
    efeito: chave do cache do painel (ou lente) regravada depois do início
    depende: [E1, E10, E14]
    sem_itcampo: igual
  E16:
    tipo: entregar
    nome: Entregar produto
    recursos: [cpu_leve]
    nos: [vm1, vm2]
    volta:
      nos: [vm2]
    timeout_s: 3600
    prioridade: 35
    efeito: dossiê no padrão da casa com manifesto de hashes, validador de citações e message_id do envio
    depende: [E14]
    sem_itcampo: VM-1/VM-2
  E17:
    tipo: manter
    nome: Manter
    recursos: [disco]
    nos: [vm1, vm2]
    volta:
      nos: [vm2, vm1]
    timeout_s: 7200
    prioridade: 60
    efeito: backup com restauração testada / checkpoint do WAL / VACUUM condicional / zelador com espaço medido
    depende: []
    sem_itcampo: VM-2/VM-1
  E18:
    tipo: observar
    nome: Observar
    recursos: [cpu_leve]
    nos: [vm1, vm2, itcampo]
    volta:
      nos: [vm1, vm2]
    timeout_s: 900
    prioridade: 25
    efeito: métrica/SLO/estado honesto gravado em fluxo.metricas ou item de automelhoria aberto
    depende: []
    sem_itcampo: todos
fontes: {siafe_ob: OB nova ou regravada no SIAFE, siafe_status: 'Status de envio de OB recoletado (devolvida pelo banco, paga)', siafe_gd: Guia de Devolução
    ingerida, sei_lote: Lote SEI de outro nó (VM-2 / it-campo) aprovado na conferência, sei_arquivado: Processo SEI capturado ou recapturado na VM-1 (arquivado),
  sei_ficha: Ficha de processo SEI nova, sei_lex: Parecer de execução (Lex) novo, sei_leitura_dupla: Leitura dupla nova, contratos_tcerj: Contrato novo
    no TCE-RJ / PNCP / SIGA, tcerj_licitante: Licitantes novos do TCE-RJ (vencedor e perdedor por certame municipal), sancoes: Sanção nova (CEIS/CNEP/CEPIM),
  doerj: 'Ato novo no DOERJ (contratação, TAC)', triagem: 'Veredito novo na triagem de alertas (leituras, Opus)', revisao_humana: Revisão humana de alerta
    (confirmado / descartado), regra_pericia: Correção na régua da perícia contábil / Guia de Devolução / termo aditivo nos autos, regra_emendas: Correção
    nos detectores de emendas (D1–D6), regra_pcrj: Correção nos detectores da Prefeitura (D7–D12), pcrj_base: 'Despesa, contrato ou licitação nova da Prefeitura
    do Rio', emendas_base: Emenda nova na base, ocr_gpu: 'Texto novo do OCR por IA (GPU do it-campo, Surya 2.5) chegou ao cache SEI', ocr_reserva: Texto
    novo do OCR de reserva (RapidOCR em CPU — VM-2 com a GPU parada; it-campo em paralelo) chegou ao cache SEI, regra_vinculo: Correção na regra do vínculo
    OB↔contrato, regra_territorio: Correção no motor território (mapa por município), regra_governo_couto: Correção nas regras da gestão Couto, regra_orcamento: Correção
    no orçamento por órgão, regra_detectores: Correção de detector ou de regra de qualidade, vault_casos_md: Caso do vault criado ou editado (afirmação
    que o juiz de qualidade tem de julgar), produtos_casa: 'Produto da casa novo (relatório de fornecedor/órgão, parecer Lex, dossiê em reports/)', regra_iss_retido: Correção
    no detector de ISS retido na NF × OB, pericia_agentes: Laudo novo ou refeito de perícia por agente (leitura integral do processo), autoaprimoramento_registro: 'Registro
    da automelhoria da perícia mudou (versão nova, veredito do portão, promoção)', memoria_claude: Decisão do dono ou lição registrada na memória dos agentes,
  conferencia_opus: Conferência do Opus corrigiu resultado produzido em contingência (Claude da assinatura no limite), decisao_dono: Decisão do dono que
    muda requisito (manual), compras_diretas_tcerj: Compras diretas novas do TCE-RJ (dispensas e inexigibilidades), regra_fracionamento: Correção na régua
    de fracionamento por objeto (art. 75 §1º), codigo_commit: 'Commit novo no código do repositório canônico (VM-1) — sonda git da
    propagação, entregue pela ponte (propagacao_ponte)'}
rotinas:
  e2_semear:
    estagio: E2
    descricao: 'Semeador do backlog do E2 (O9.0): processos SEI-RJ com OB paga e sem árvore viram jobs nativos arvore:<processo> na prioridade única (arvore.fila / prioridade.ordenar, cota Couto como reserva), teto por ciclo, idempotente pela chave'
    comando: ['{py}', -m, tools.e2_semear, --teto, '40']
    recursos: [cpu_leve]
    nos: [vm1]
    timeout_s: 1800
    volta: {nos: [], nota: 'sem volta: o compliance.db só existe na VM-1'}
    nota: 'O9.0 (25/11/2026). No lugar da varredura do backlog que o sweep_sei (substituida_por E2) fazia. Medido na VM-1 em 25/11: 1 min 54 s por ciclo (fila inteira ordenada). Não abre navegador: só enfileira; quem lê o SEI é o job nativo arvore (1 porta)'
    agenda:
    - {cron: '25 */2 * * *'}
    origem: [o90-religacao]
    efeito: {descricao: 'os escolhidos estão na fila como arvore:<processo> (idempotente pela chave)', log_contem: 'e2_semear: semeados [0-9]+ de [0-9]+'}
  e1_eventos:
    estagio: E1
    descricao: 'E1 → estágios nativos (O9.0): emite coleta/ob_nova (OB emitida nova, por processo SEI-RJ), coleta/fonte_mudou (unidade do E9 cuja tabela mudou) e coleta/conferidos (veredito novo da triagem) a partir da coleta legada'
    comando: ['{py}', -m, tools.e1_eventos]
    recursos: [cpu_leve]
    nos: [vm1]
    timeout_s: 900
    volta: {nos: [], nota: 'sem volta: o compliance.db só existe na VM-1'}
    nota: 'O9.0 (25/11/2026). Sem este passo as rotas nativas que começam em coleta/* (E2, E9, E15 siafe_stats, E13) não teriam produtor em produção — só o ensaio O8.5 os emitia. OB nova = número acima do maior visto na (UG, exercício), não a data de coleta (a recoleta regrava coletado_em de tudo). Primeira volta da religação leva desde=parada (JFN_DESDE)'
    evento: {depende: [siafe_ob, siafe_status, contratos_tcerj, compras_diretas_tcerj, triagem], debounce_s: 300, agrupar: true}
    agenda:
    - {cron: '12 * * * *'}
    origem: [o90-religacao]
    efeito: {descricao: 'eventos coleta/* gravados no fluxo.eventos e só depois a marca regravada', arquivo: data/e1_eventos_marca.json, log_contem: 'e1_eventos: (emitidos [0-9]+|sem novidade)'}
  manutencao_semanal:
    estagio: E17
    descricao: Manutenção semanal do compliance.db (VACUUM condicional, ANALYZE, WAL)
    comando: ['{py}', -m, compliance_agent.manutencao, --tudo]
    nos: [vm1]
    timeout_s: 7200
    concorrencia: [disco_vm1]
    agenda:
    - {cron: 0 3 * * 0}
    origem: [vm1-cron-compliance-agent-manutencao]
    efeito: {descricao: 'Manutenção semanal do compliance.db (VACUUM condicional, ANALYZE, WAL): rodou até o fim sem traceback', so_rc: 'efeito próprio
        a declarar ao portar a rotina para o estágio (O3–O8); até lá: rc 0 + log sem traceback'}
  checkpoint_wal:
    estagio: E17
    descricao: Checkpoint do WAL do compliance.db
    comando: ['{py}', -c, from compliance_agent.manutencao import checkpoint_wal as c; print(c())]
    nos: [vm1]
    timeout_s: 600
    trava: data/locks/manut_wal.lock
    concorrencia: [disco_vm1]
    volta: {nos: [], nota: 'sem volta: o dado/serviço só existe na VM-1'}
    nota: segue no cron durante a parada (ressalva 3); migra na O9.0 (tools/cron_para_fluxo.py --aplicar comenta a linha do cron)
    agenda:
    - {cron: 25 */6 * * *}
    origem: [vm1-cron-compliance-agent-manutencao-2]
    efeito: {descricao: 'o checkpoint devolveu o tamanho do -wal antes e depois', log_contem: "'wal_depois': [0-9]+"}
  siafe_runner_diario:
    estagio: E1
    descricao: 'SIAFE: coleta diária de OB/NE/NL'
    comando: ['{py}', -m, compliance_agent.siafe_runner, diario]
    concorrencia: [siafe_sessao]
    timeout_s: 7200
    agenda:
    - {cron: 0 5 * * *}
    origem: [vm1-cron-compliance-agent-siafe-runner-diario]
    recursos: [navegador]
    nos: [vm1]
    efeito: {descricao: 'SIAFE: coleta diária de OB/NE/NL: rodou até o fim sem traceback', so_rc: 'efeito próprio a declarar ao portar a rotina para o estágio
        (O3–O8); até lá: rc 0 + log sem traceback'}
  siafe_runner_retentar:
    estagio: E1
    descricao: 'SIAFE: retentar coletas capadas/falhas'
    comando: ['{py}', -m, compliance_agent.siafe_runner, retentar, '10']
    concorrencia: [siafe_sessao]
    timeout_s: 3600
    agenda:
    - {cron: '55 9,13,17 * * *'}
    origem: [vm1-cron-compliance-agent-siafe-runner-retentar]
    recursos: [navegador]
    nos: [vm1]
    efeito: {descricao: 'SIAFE: retentar coletas capadas/falhas: rodou até o fim sem traceback', so_rc: 'efeito próprio a declarar ao portar a rotina para
        o estágio (O3–O8); até lá: rc 0 + log sem traceback'}
  siafe_drenar_capados:
    estagio: E1
    descricao: 'SIAFE: dreno dos dias capados'
    comando: [bash, tools/siafe_drenar_capados.sh, '5']
    concorrencia: [siafe_sessao]
    timeout_s: 3600
    agenda:
    - {cron: 50 */2 * * *}
    origem: [vm1-cron-siafe-drenar-capados-sh]
    recursos: [navegador]
    nos: [vm1]
    efeito: {descricao: 'SIAFE: dreno dos dias capados: rodou até o fim sem traceback', so_rc: 'efeito próprio a declarar ao portar a rotina para o estágio
        (O3–O8); até lá: rc 0 + log sem traceback'}
  siafe_documento_sweep:
    estagio: E1
    descricao: 'SIAFE: varredura de documentos (NE/NL) por exercício'
    comando: ['{py}', tools/siafe_documento_sweep.py]
    carregar_env: true
    concorrencia: [siafe_sessao]
    timeout_s: 14400
    agenda:
    - cron: 10 3 * * *
