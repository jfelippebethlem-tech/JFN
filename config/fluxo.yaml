    - {cron: '20 * * * *'}
    evento: {depende: [siafe_ob, siafe_status, siafe_gd, contratos_tcerj, tcerj_licitante, pcrj_base, sancoes, sei_arquivado, sei_lote, sei_ficha, triagem, revisao_humana, memoria_claude, regra_detectores, codigo_commit], debounce_s: 600, intervalo_min_s: 1800, agrupar: true}
    origem: [prewarm_painel]
    efeito: {descricao: 'cada visão regravada com sha256 conferido no disco (a CLI só imprime depois de conferir)', log_contem: 'materializar: [a-z_]+ sha256 [0-9a-f]{16} conferido'}
