    estagio: E3
    descricao: 'E3 capturar (O3.3): só os documentos novos (delta por id_documento sobre os guardados do PG) por tools/sei_integra_completa.py com o delta da chave JFN_E3_DELTA (desligada = sombra: baixa tudo e registra o plano; =1 só o novo/mudado — ligada na O9.0), Gerar PDF em lotes de 40 com conferência por marcador e laço até o fim; versões sha256 (hash_de binario) + aquisicao no PG; efeito só com 0 omitido recontado'
