    recursos: [navegador]
    nos: [vm2]
    timeout_s: 3600
    prioridade: 50
    concorrencia: [sei_rj_ip]
    ativa: false
    bloqueio: 'parada de obras (24/11/2026); religar na O9.0 junto com o arvore_e2 (o E3 só nasce do evento arvore/documento_novo). Antes de religar: o arquivador (E4/E7) tem de ler as versões binárias do E3 em data/sei_cache/integra_<pasta>'
    nota: 'O3.3. Por processo: job `capturar:<processo>`; esta rotina só LISTA os processos cuja leitura vigente do E2 tem documento sem versão (só leitura do PG); a CLI `um --processo` roda E2+E3 de um processo fora do motor (teste real). Substitui sei_integra_fila, integra_fila_dinheiro, vm2_integras, sei_integra_vm2_precalcular, run_integras_bombeiros e bombeiros_integra_supervisor'
