    comando: ['{py}', -m, compliance_agent.aplicacao.estagios.arvore, fila, --limite, '20']
    recursos: [navegador]
    nos: [vm2]
    timeout_s: 3600
    prioridade: 50
    concorrencia: [sei_rj_ip]
    ativa: false
    bloqueio: 'parada de obras (24/11/2026): nenhum navegador SEI religado; religar na O9.0 com captura_001.sql aplicado no esquema public (`arvore schema aplicar`) e o planejador agendando o tipo nativo `arvore:<processo>` na ordem da `fila`. Esta rotina só imprime a fila (não abre navegador)'
    nota: 'O3.3. Por processo: job `arvore:<processo>` (handler + efeito do estágio nativo; idempotente pela posse (chave, ficha); evento arvore/documento_novo suja o E3). Substitui sweep_sei, sweep_sei_noturno, varredura_sei_lane, vm2_sweep_geral e o sei_bombeiros_sweep (lente bombeiros: paridade por replay do bombeiros_sweep.out sobre o snapshot da parada, 3.859 capturados ⊆ 25.078 selecionados, 0 faltando; `arvore paridade --lente bombeiros`)'
    agenda:
    - {cron: '20 */2 * * *'}
    origem: [sweep_sei, sweep_sei_noturno, varredura_sei_lane, vm2_sweep_geral, sei_bombeiros_sweep]
    efeito: {descricao: 'a fila impressa na ordem única com os componentes de cada posição; a prova por processo é o efeito do job arvore:<processo> (hash recalculado dos ids gravados e faltas recontadas no PG)', so_rc: 'a CLI fila só lê (fonte só-leitura imutável); o efeito real é o do job nativo'}
