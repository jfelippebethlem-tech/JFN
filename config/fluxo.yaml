    nota: 'O3.4. Por versão binária: job `texto:` (handler + efeito do estágio nativo; idempotente pela entrada+motor no UNIQUE da transformacao). Eventos: texto/texto_novo (E8), texto/pagina_escaneada (E5), texto/sem_ocr (E7), texto/invalido (recaptura). Absorve a extração do sei_arquivar (arquivar_cache_lane/arquivar_integra_lane continuam como legado até a O9.0)'
