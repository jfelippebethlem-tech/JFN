  # O5.3 fatia 1 (24/11/2026): as quatro regras a_portar acima, portadas como detectores GENÉRICOS do E10
  # (compliance_agent/aplicacao/estagios/detectar.py), SOMBRA ⚖️: gravam só no esquema `sombra` do PG; Tier 3 até medir.
  e10.p4_fracionamento_objeto:
    modulo: compliance_agent/aplicacao/detectores/fracionamento_objeto.py
    simbolo: detectar
    afirma: 'Fracionamento de despesa por objeto (art. 75 §1º): dispensas por valor de mesma natureza na mesma unidade e
      exercício que, somadas, passam do teto ou se agrupam rente a ele — réguas do sweep (MAX por processo, reforma é
      obra e mão de obra não é) + card P4'
    fonte:
    - compras_diretas_tcerj
    - dominio.elegibilidade (E9, exigência dispensa_valor)
    grava: PG jfn_evidencias, esquema sombra (execucao_regra + achado), via estágio E10 detectar
    consome:
    - relatório de paridade O5.3 (vault)
    manchete: false
    controle_positivo: tests/test_detector_e10_fracionamento_objeto.py::test_positivo_reforma_e_obra_e_soma_acima_do_teto
    controle_negativo: tests/test_detector_e10_fracionamento_objeto.py::test_negativo_mao_de_obra_e_inelegivel_ficam_fora
    hipoteses_inocentes:
    - hipotese: "'mão de obra' não é obra; aquisição de material de construção é compra"
      excluida_por: compliance_agent/aplicacao/detectores/fracionamento_objeto.py:tipo_objeto
    - hipotese: inscrição, anuidade, juros e multas, credenciamento, DEA e consumo de concessionária não são
        contratação de objeto
      excluida_por: compliance_agent/aplicacao/detectores/fracionamento_objeto.py:dispensa_por_valor
    - hipotese: itens e grafias do mesmo processo contados mais de uma vez
      excluida_por: compliance_agent/aplicacao/detectores/fracionamento_objeto.py:_itens
    - hipotese: manutenção de veículos da frota até o valor do §7º do art. 75 não entra no somatório do §1º
      excluida_por: compliance_agent/aplicacao/detectores/fracionamento_objeto.py:frota_par7
    - hipotese: demandas imprevisíveis distintas (manutenção corretiva) ou unidades gestoras autônomas
      excluida_por: null
    dominio: dispensas por valor do espelho TCE-RJ (compras_diretas_tcerj) elegíveis na E9 (dispensa_valor = E)
