    controle_negativo: tests/test_economia_potencial.py::test_ata_de_registro_de_precos_vai_para_o_teto
    hipoteses_inocentes:
    - hipotese: ata de registro de preços (quantidade estimada)
      excluida_por: compliance_agent/comparador_precos.py:economia_potencial
    - hipotese: unidade diferente/ambígua
      excluida_por: compliance_agent/comparador_precos.py:economia_potencial
    - hipotese: inexigibilidade e agricultura familiar
      excluida_por: compliance_agent/comparador_precos.py:economia_potencial
    - hipotese: comodato embutido no preço
      excluida_por: compliance_agent/comparador_precos.py:economia_potencial
    - hipotese: compra não conferida no PNCP
      excluida_por: compliance_agent/comparador_precos.py:economia_potencial
    dominio: compras homologadas do Estado do RJ e da Prefeitura do Rio, fora de ata; não é OB paga
    fp_medida: null
    revisao_2026_11_13:
      veredito: PARCIAL
      afirmado: R$ 5.976.128,58 de economia potencial
      sustentado: ≤ R$ 5,02 mi como teto teórico; pago INDISPONÍVEL
  comparador.economia_vedada:
    modulo: compliance_agent/comparador_precos.py
    simbolo: economia_vedada
    afirma: Indício de sobrepreço pago a fornecedor com sanção vigente e com alcance
    fonte:
