  det.P4Fracionamento:
    modulo: compliance_agent/detectores/p4_fracionamento.py
    simbolo: P4Fracionamento
    afirma: 'Indício de fracionamento: dispensas por valor do mesmo ramo, na mesma UG e exercício, somam acima do limite
      do ano ou se agrupam rente ao teto'
    fonte:
    - compras_diretas_tcerj
    - ordens_bancarias
    grava: processo_avaliacao (via compliance_agent/processo_360.py → coletor_edital.rodar_planejamento); JSON avulso (tools/sweep_fracionamento_tcerj.py);
      não está em varredura_certames nem varredura_execucao
    consome:
    - processo_360
    - rotas/produtos.py
    manchete: false
    controle_positivo: tests/test_p4_fracionamento.py::test_tres_dispensas_mesma_natureza_acima_do_limite_confirma
    controle_negativo: tests/test_p4_fracionamento.py::test_soma_sob_o_limite_descartado
    hipoteses_inocentes:
    - hipotese: somar exercícios distintos contra o limite de um só ano
      excluida_por: compliance_agent/detectores/p4_fracionamento.py:P4Fracionamento.avaliar
    - hipotese: unidades gestoras distintas (art. 75, §1º, I)
      excluida_por: compliance_agent/detectores/p4_fracionamento.py:P4Fracionamento.avaliar
    - hipotese: dispensa por outro inciso (emergência, inexigibilidade etc.) não soma para o teto de valor
      excluida_por: compliance_agent/detectores/p4_fracionamento.py:_dispensa_por_valor
    - hipotese: consórcio público / agência executiva (limite duplicado, art. 75, §2º)
      excluida_por: compliance_agent/detectores/p4_fracionamento.py:limite_dispensa
    - hipotese: objetos de ramos distintos
      excluida_por: compliance_agent/detectores/p4_fracionamento.py:clusterizar
    - hipotese: demandas imprevisíveis independentes (rubrica LLM, teto 0,3)
      excluida_por: compliance_agent/detectores/p4_fracionamento.py:P4Fracionamento._avaliar_previsibilidade
    - hipotese: UGs autônomas com orçamento próprio (rebaixa a médio, só se o contexto declarar)
      excluida_por: compliance_agent/detectores/p4_fracionamento.py:P4Fracionamento.avaliar
    - hipotese: soma igual ao teto não excede (comparação estrita soma > limite)
      excluida_por: compliance_agent/detectores/p4_fracionamento.py:P4Fracionamento.avaliar
    dominio: dispensas por valor (art. 75, I/II, Lei 14.133/2021), por unidade gestora e exercício; limites 2021–2026 de
      compliance_agent/limites_dispensa.py
    fp_medida: null
