# Registro de quem produz afirmação sobre terceiros (detectores, regras, perícias, ferramentas).
# Regras: COR-03 (controles positivo e negativo), COR-04 (FP medida antes de manchete), COR-05 (hipótese
# inocente excluída por código), COR-09, COR-10 (domínio), CNF-05/07/11/13, COR-17.
# Controle só aponta teste ABERTO e conferido; na dúvida, null (dívida honesta). fp_medida só com medição
# REGISTRADA no repo contra fonte primária (lift contra sanção posterior NÃO é FP). A revisão cética de
# 13/11/2026 (amostra conferida em fonte primária, fora do repo) vai em `revisao_2026_11_13`.
# Código: compliance_agent/qualidade/detectores.py · catracas: tests/test_regra_controles_detector.py
detectores:
  acima_do_teto:
    modulo: compliance_agent/acima_do_teto.py
    simbolo: classificar
    afirma: Indício de remuneração acima do teto do art. 37, XI
    fonte:
    - registros_folha (via chamador)
    grava: não grava (sob demanda)
    consome:
    - relatório de teto
    manchete: false
    controle_positivo: tests/test_acima_do_teto.py::test_indicio_supersalario_mesmo_sem_indenizatorias
    controle_negativo: tests/test_acima_do_teto.py::test_dentro_apos_excluir_indenizatorias
    hipoteses_inocentes:
    - hipotese: verbas indenizatórias fora do teto
      excluida_por: compliance_agent/acima_do_teto.py:classificar
    - hipotese: RRA/retroativo
      excluida_por: compliance_agent/acima_do_teto.py:classificar
    dominio: null
    fp_medida: null
  acumulo_cargos:
    modulo: compliance_agent/acumulo_cargos.py
    simbolo: cruzar
    afirma: Indício de acúmulo de vínculo ALERJ × Executivo estadual
    fonte:
    - alerj_folha
    - registros_folha
    grava: sob demanda
    consome:
    - relatório de acúmulo
    manchete: false
    controle_positivo: tests/test_acumulo_cargos.py::test_cruzamento_detecta_acumulo
    controle_negativo: null
    hipoteses_inocentes:
    - hipotese: aposentadoria acumula (CF 37 §10)
      excluida_por: compliance_agent/acumulo_cargos.py:classificar_legalidade
    - hipotese: sem remuneração no Estado (afastado)
      excluida_por: compliance_agent/acumulo_cargos.py:classificar_legalidade
    - hipotese: exceções do art. 37, XVI (dois de professor, professor + técnico, dois de saúde)
      excluida_por: null
    - hipotese: homônimo
      excluida_por: null
    dominio: null
    fp_medida: null
  anomalias:
    modulo: compliance_agent/anomalias.py
    simbolo: rodar
    afirma: Anomalia estatística em OB (isolation forest + regras)
    fonte:
    - ordens_bancarias
    grava: ob_anomaly, ob_redflag
    consome:
    - painel (top anomalias)
    manchete: false
    controle_positivo: null
    controle_negativo: null
    hipoteses_inocentes:
    - hipotese: pagamento intragovernamental ou tributo
      excluida_por: compliance_agent/entidades_gov.py:eh_nao_fornecedor
    dominio: null
    fp_medida: null
  cge_confronto:
    modulo: compliance_agent/cge_confronto.py
