    simbolo: P1EspecificacaoDirigida
    afirma: Indício de termo de referência redigido sob medida para um produto (marca/modelo sem 'ou equivalente', valores
      de datasheet)
    fonte:
    - edital_documento
    - pncp_resultado
    - sei_arquivo
    grava: achado_certame (via compliance_agent/varredura_certames.py); processo_avaliacao (via compliance_agent/processo_360.py
      → coletor_edital.rodar_planejamento)
    consome:
    - processo_360
    - rotas/vinculos.py
    - rotas/produtos.py
    manchete: false
    controle_positivo: tests/detectores/test_p1_especificacao_dirigida.py::test_marca_sem_ou_equivalente_e_critico
    controle_negativo: tests/detectores/test_p1_especificacao_dirigida.py::test_especificacao_neutra_nao_inventa_indicio
    hipoteses_inocentes:
    - hipotese: marca citada como referência com 'ou equivalente/similar/superior' (art. 41)
      excluida_por: compliance_agent/detectores/p1_especificacao_dirigida.py:P1EspecificacaoDirigida.avaliar
    - hipotese: cláusula que VEDA a indicação de marca
      excluida_por: compliance_agent/detectores/p1_especificacao_dirigida.py:_pista_nominativa
    - hipotese: homônimo (termo de referência, modelo de formulário, modelo digital, campo marca da proposta)
      excluida_por: compliance_agent/detectores/p1_especificacao_dirigida.py:_pista_nominativa
    - hipotese: padronização formal (art. 43) — rebaixa
      excluida_por: compliance_agent/detectores/p1_especificacao_dirigida.py:P1EspecificacaoDirigida.avaliar
    - hipotese: item único real (carta de exclusividade)
      excluida_por: null
    - hipotese: valor não-redondo vindo de norma técnica (ABNT/Anvisa)
      excluida_por: null
    dominio: certames com termo de referência/requisitos (Lei 14.133/2021, art. 41)
    fp_medida: null
