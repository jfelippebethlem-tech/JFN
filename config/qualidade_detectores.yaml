    manchete: true
    controle_positivo: tests/test_caro_e_suspeito.py::test_dossie_cruza_caro_com_sancionado
    controle_negativo: tests/test_caro_e_suspeito.py::test_sancao_posterior_a_compra_nao_e_sancionada
    hipoteses_inocentes:
    - hipotese: sanção posterior à compra
