# fontes_cobertura.yaml — CONTRATO DE INGESTÃO do JFN (O4.11 do plano Esteira Única; doc 2 §40).
#
# Validado por compliance_agent.ingestao.contrato (Pydantic); medido pelos 6 sensores de
# compliance_agent.ingestao.sensores; lote e quarentena em compliance_agent.ingestao.quarentena
# (tabelas `ingestao_lote` e `ingestao_quarentena`, migração Alembic 0003_ingestao_quarentena).
#   python -m compliance_agent.ingestao validar        # contrato + cobertura das 36 fontes de config/propagacao.yaml
#   python -m compliance_agent.ingestao medir --db <cópia do snapshot> --imutavel
#
# Campos por fonte:
#   natureza       externa (dado que vem de fora: tem chave, domínio, SLO) | interna (regra no git, laudo, memória)
#   dono           quem responde pela fonte (papel, não pessoa)
#   frequencia     diaria | semanal | mensal | sob_demanda | evento
#   estado         ATIVA | PARCIAL (coleta incompleta conhecida) | PARADA (coletor não roda) |
#                  CONGELADA_NA_ORIGEM (a fonte parou de publicar) | INDISPONIVEL (a fonte nos recusa)
#   slo_frescor_h  atraso máximo da coluna_frescor (horas) antes do sensor de atualidade acusar ATRASADO
#   chave_natural  identidade do registro NA FONTE (nunca o rowid nosso)
#   campos         tipo (texto|inteiro|real|data_iso|data_br|datahora_iso|cnpj|cpf_cnpj|processo_sei|ug|ano),
#                  obrigatorio, critico (entra na completude), regex, minimo/maximo, dominio
#   teto_paginas   parada dura do paginador (nunca "acabou": teto atingido = base INCOMPLETA)
#   efemera        true = some da origem se não for coletada a tempo (notícia, RSS); false = re-obtível
#   propagacao     ids de config/propagacao.yaml que esta fonte alimenta (todas as 36 têm de estar cobertas)
#   recuperacao    comando da recuperação da lacuna para a religação O9.0 — NADA aqui roda sozinho
#
# Sem topologia sensível: nenhum host interno, IP, porta, credencial ou caminho de máquina.
# Números de estado medidos no snapshot congelado de 24/11/2026 (md5 b20799beee1cb0a130689ccec1665ca2);
# diagnóstico completo em ~/vault/refatoracao/ingestao-diagnostico-20261124.md.

versao: 1
revisado_em: 2026-11-24

fontes:

  # ─── SIAFE-Rio 2 (navegador, sessão única; só ele é PAGO — Empenho ≠ Liquidação ≠ OB) ────────────────
  siafe_ob:
    nome: OB orçamentária do SIAFE-Rio 2 (fonte canônica do pagamento)
    natureza: externa
    dono: frente SIAFE (coleta E1 coletar:siafe)
    coletor: compliance_agent.siafe_ob_orcamentaria
    frequencia: diaria
    estado: PARCIAL
    motivo_estado: >-
      completude por (UG, exercício) não provada: 80 pares 2021–2026 com < 100 OB e pares como 370300/2024
      (500 OB, densidade 6,8% da faixa numérica, nada antes de 22/08) — recolher por UG na O9.0
    tabela: ob_orcamentaria_siafe
    coluna_frescor: coletado_em
    slo_frescor_h: 36
    chave_natural: [numero_ob, ug_emitente, exercicio]
    campos:
      numero_ob: {tipo: texto, obrigatorio: true, critico: true, regex: '\d{4}OB\d{5}'}
      ug_emitente: {tipo: ug, obrigatorio: true, critico: true}
      exercicio: {tipo: ano, obrigatorio: true, minimo: 2016, maximo: 2027}
      data_emissao: {tipo: data_br, obrigatorio: true, critico: true}
      status: {tipo: texto, obrigatorio: true, critico: true, dominio: [Contabilizado, Anulado, Excluído, Não contabilizado]}
      status_envio:
        tipo: texto
        dominio: [Processado e Pago, Enviado Manualmente, Erro no Pagamento, Enviado ao Banco, Parcialmente Pago,
                  Aguardando Envio, Aguardando Geração RE]
      credor: {tipo: texto, obrigatorio: true, critico: true}
      valor: {tipo: real, obrigatorio: true, critico: true, minimo: 0}
      processo: {tipo: texto}
      coletado_em: {tipo: datahora_iso, obrigatorio: true}
    consistencia:
      - {tipo: data_no_exercicio, campos: [data_emissao, exercicio]}
    efemera: false
    propagacao: [siafe_ob]
    observacao: >-
      SIAFE 2 só serve os exercícios 2023–2027 (SIAFE 1 desativado em 10/11/2026): 2016–2022 já não é re-obtível.
      Teto de 1.000 linhas por consulta (platô real 981–997) — furado por fatia de número e por UG. Pago = _ob_paga
      (cruzamentos_intel): Contabilizado, sem Erro no Pagamento, sem Pagamento Complementar, sem reemitida, com número.
    recuperacao: >-
      PYTHONPATH=. .venv/bin/python -m compliance_agent.siafe_ob_orcamentaria --por-ug <UG> --exercicio <ANO>
      (um par por vez, fila = pares com densidade < 30% ou contagem redonda; bash tools/siafe_drenar_capados.sh 0 lista)

