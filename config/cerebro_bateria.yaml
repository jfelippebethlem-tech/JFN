# cerebro_bateria.yaml — BATERIA DE RECALL do segundo cérebro (docs/ARQUITETURA-SEGUNDO-CEREBRO-ALVO.md §7).
#
# Cada pergunta tem a(s) NOTA(S) do vault que a respondem (`ok`), definida(s) ANTES de qualquer consulta.
#   grupo dono   20 perguntas LITERAIS do dono (erros de digitação mantidos), gabarito pré-registrado em 14/11/2026
#                (vm2:~/khoj-piloto/gabarito_r2.json, sha256 0a54c45c…) — é a rodada cega Khoj × jfn-brain.
#   grupo casos  perguntas escritas pelo agente em 19/11/2026 a partir do resumo de notas de ~/vault/casos, no jeito
#                curto do dono e SEM copiar o título; `resposta` = o que se espera ler; `contem` = trecho LITERAL
#                que tem de existir na nota do gabarito (conferido por `tools/cerebro_bateria.py validar` — controle
#                positivo do próprio gabarito: nota que mudou e perdeu o trecho derruba a validação, não o recall).
#   grupo cruzamento  perguntas por ENTIDADE (fase 4): "quais casos envolvem o CNPJ X" e "o que a UG U pagou à empresa Y".
#                `ok` = TODAS as notas de casos/ que citam o identificador (levantadas por grep, não pelo cérebro);
#                `entidade` = o que se passa ao `brain_entity`; `resposta` traz o valor pago conferido no SIAFE em
#                19/11/2026 (só OB paga, filtro cruzamentos_intel._ob_paga) — o valor cresce com a coleta, por isso
#                `validar` confere só que AINDA existe OB paga para o par (`sql_pago`), não o número.
#                Além da posição, mede-se a COBERTURA: quantas das notas esperadas vieram entre as 10 primeiras.
# Medida: a nota certa entre as k primeiras NOTAS distintas devolvidas (recall@1/5/10, MRR@10).
# Regras: pergunta nova só no FIM do grupo (ids são contrato); nunca ajustar pergunta para um buscador acertar.
# Nada de CPF, e-mail, WhatsApp ou nome de pessoa física aqui (CNPJ e nº de processo são dado público).
versao: 1
# Notas que CITAM as perguntas da bateria ao pé da letra (a ata da rodada cega transcreve as 20 do dono): saem da
# lista de TODOS os sistemas antes de contar a posição — senão o buscador "acerta" a ata, não a nota que responde.
