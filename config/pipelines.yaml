# pipelines.yaml — INVENTÁRIO CANÔNICO dos pipelines do ecossistema + SLO de frescor por etapa.
# Consumido por tools/pipelines_slo.py (cron horário). Complementa o /api/agenda: a agenda mostra
# QUANDO os gatilhos disparam; aqui vigiamos SE cada etapa PRODUZIU output (mtime do log-sentinela).
# Lição de origem (2026-07-07): o sei_supervisor órfão starvou o downstream por 28 dias com a agenda
# toda verde — frescor de OUTPUT é o sinal que pega starvation/lock/loop silencioso.
#
# Campos: nome · arquivo (sentinela; relativo a ~/JFN salvo se absoluto) · max_stale_h (SLO) ·
# grupo · pausa (flag que legitima silêncio) · nota (contexto p/ quem debuga o alerta).

pipelines:
  # ---- BASE (dados-fonte, diários) ----
  - nome: siafe-runner
    arquivo: data/siafe_runner_cron.log
    consulta: "SELECT MAX(coletado_em) FROM ob_orcamentaria_siafe"
    max_stale_h: 30
    grupo: base
    nota: >-
      coleta SIAFE diária 05:00 (cron). Vigia o DADO (última OB coletada), não o log: medido em
      2026-07-28, a coleta ficou 10 dos últimos 30 dias sem produzir uma linha e o SLO seguiu
      verde, porque o runner escreve o log mesmo quando não traz nada. O sintoma apareceu antes
      no diário do vault — 19 e 20/07 com o mesmo número ao centavo.

  - nome: folha-orquestrador
    arquivo: data/folha_orquestrador_cron.log
    max_stale_h: 30
    grupo: base
    nota: folhas Câmara/Prefeitura 06:00 (cron)

  - nome: manutencao-diaria
    arquivo: data/manutencao_diaria_cron.log
    max_stale_h: 30
    grupo: base
    nota: wal_checkpoint + ANALYZE 04:10 (cron)

  - nome: backup-compliance
    arquivo: data/backup_compliance_cron.log
    max_stale_h: 192
    grupo: base
    nota: backup semanal dom 03:50 (cron)

  # ---- PIPELINE SEI (downstream do cron */30 sweep_sei.sh — vítimas da starvation de 07-07) ----
  - nome: sei-depurar
    arquivo: data/sei_depurar.log
    max_stale_h: 12
    grupo: sei
    pausa: data/.pause_sei_sweep
    nota: ficha->tabela; roda em TODO ciclo completo do cron (e no lane bombeiros)

  - nome: sei-direcionamento
    arquivo: data/sei_direc.log
    max_stale_h: 24
    grupo: sei
    pausa: data/.pause_sei_sweep
    nota: memória de direcionamento + LLM top-score (fim do ciclo do cron)

  - nome: lex-pesquisa-internet
    arquivo: data/lex_pesquisa.log
    max_stale_h: 24
    grupo: sei
    pausa: data/.pause_sei_sweep
    nota: fase 5 (OSINT dos top-score) — só roda se o ciclo do cron chega ao fim

  - nome: lex-execucao
    arquivo: data/lex_execucao.log
    max_stale_h: 24
    grupo: sei
    pausa: data/.pause_sei_sweep
    nota: avaliação de execução contratual (fim do ciclo)

  - nome: pericia-aprendizado
    arquivo: data/pericia_aprendizado.log
    max_stale_h: 24
    grupo: sei
    pausa: data/.pause_sei_sweep
    nota: loop de aprendizado progressivo da perícia (fim do ciclo)

  - nome: sei-integra-fila
    arquivo: data/sei_integra_fila.log
    max_stale_h: 30
    grupo: sei
    nota: íntegras noturnas 04:00 + timer 03:30

  - nome: pericia-sweep
    arquivo: data/pericia_sweep_cron.log
    max_stale_h: 30
    grupo: sei
    nota: perícia diária 06:30 (cron)

  # ---- LANE BOMBEIROS (FUNESBOM, supervisor contínuo dedicado) ----
  - nome: bombeiros-lane
    arquivo: data/bombeiros_supervisor.log
    max_stale_h: 6
    grupo: bombeiros
    pausa: data/.pause_bombeiros
    nota: supervisor contínuo (lote ~1h + back-off 20min); 6h parado = morreu

  # ---- POLIMONITOR ----
  - nome: likers-import
    arquivo: /home/ubuntu/polimonitor/data/likers_import_cron.log
    max_stale_h: 72
    grupo: polimonitor
    nota: guard de mtime só escreve com dado novo; desktop offline = silêncio legítimo (por isso 72h)

  - nome: posts-index
    arquivo: /home/ubuntu/polimonitor/data/posts_index_cron.log
    max_stale_h: 30
    grupo: polimonitor
    nota: reindex p/ coletor do desktop, 04:40-09:40 (cron)

  # ---- SECOND BRAIN ----
  - nome: hermes-rag
    arquivo: data/rag/corpus_hash.txt
    max_stale_h: 30
    grupo: second-brain
    nota: verificação/rebuild incremental (metacognição 06:50 + cron 13:07); mtime marca a checagem

  # ---- PCRJ (Prefeitura do Rio — coletas que alimentam a esfera do painel) ----
  - nome: pcrj-fisc-refresh
    arquivo: data/fisc_coletar_tudo.log
    consulta: "SELECT MAX(coletado_em) FROM emendas"
    max_stale_h: 192
    grupo: pcrj
    nota: >-
      refresh semanal seg 00:30 (timer jfn-fisc-refresh) — emendas + ContasRio + PNCP municipal.
      Vigia o DADO, não o log: medido em 2026-08-09, o SLO acusava 710h de atraso enquanto o
      serviço rodava toda semana e saía 0. O `ExecStart` do unit NÃO redireciona a saída para
      `data/fisc_coletar_tudo.log` (vai para o journal), então o arquivo estava congelado em
      10/07 — alarme falso, que é alarme desligado. `emendas.coletado_em` marcava 03/08 03:36,
      exatamente a execução do timer.

  - nome: pcrj-comissionados
    arquivo: data/pcrj_comiss_mensal.log
    max_stale_h: 800
    grupo: pcrj
    nota: coleta mensal de comissionados×candidatos (pcrj_comissionado_candidato); alimenta a aba Comissionados

  - nome: pcrj-db-vivo
    arquivo: data/pcrj.db
    max_stale_h: 192
    grupo: pcrj
    nota: mtime do banco pcrj.db — qualquer coleta nominal (câmara/cruzamento/TSE/D.O.) o toca; parado >8d = starvation

  - nome: pcrj-beneficios-base
    arquivo: data/pcrj_benef.db
    max_stale_h: 1080
    grupo: pcrj
    nota: ingest mensal do Portal da Transparência (competência sai com ~2 meses de atraso editorial); >45d = investigar

  # ---- ENRIQUECIMENTO ----
  - nome: sweep-dados
    arquivo: data/sweep_dados.log
    max_stale_h: 30
    grupo: enriquecimento
    pausa: data/.pause_sweeps
    nota: benefícios/fachada 10:00 e 16:00 (cron)

  - nome: refresh-favorecido
    arquivo: data/refresh_favres.log
    max_stale_h: 30
    grupo: enriquecimento
    nota: resumo de favorecidos 05:45 (cron)

  # ---- FONTES QUE NÃO TINHAM VIGIA (acrescentadas 2026-07-30) ----
  # Levantamento de integrações: SIAFE, PNCP, SEI e LLM tinham SLO ou contrato `disponivel()`.
  # TCE-RJ e DataJud tinham ZERO — nem SLO, nem health check, nem entrada aqui. Fonte sem vigia é
  # fonte que envelhece calada, e foi exatamente assim que o SIAFE ficou 10 de 30 dias sem produzir
  # uma linha com o painel verde.
  - nome: tcerj-aberto
    arquivo: data/tcerj_aberto_cron.log
    consulta: "SELECT MAX(data_contratacao) FROM contratos_tcerj"
    max_stale_h: 720
    grupo: base
    pausa: data/_pausa_tcerj
    nota: >-
      API de dados abertos do TCE-RJ (contratos, compras diretas, penalidades). Vigia o DADO
      (contrato mais recente), não o log — mesma lição do siafe-runner. 720h porque a base do TCE
      publica em lote, não diariamente; alarme antes disso seria ruído.
      LIMITE DA FONTE, catalogado em compliance_agent/limites_de_fonte.py: esta API **não tem**
      endpoint de jurisprudência — quem procurar acórdão do TCE-RJ aqui não vai achar, e isso não é
      defeito de coleta.

  - nome: datajud-cnj
    arquivo: data/datajud_cron.log
    max_stale_h: 720
    grupo: base
    pausa: data/_pausa_datajud
    nota: >-
      API pública do DataJud/CNJ (182 tribunais, chave pública, sem WAF — verificado 2026-07-27).
      LIMITE DA FONTE: os documentos trazem só METADADOS (número, classe, assunto, órgão julgador,
      movimentos). **Não há nome de parte, CPF/CNPJ nem teor de decisão** (Portaria CNJ 160/2020),
      então NÃO serve para "achar processo do fornecedor X pelo CNPJ" — promessa que aparece em doc
      de terceiro e é falsa. Serve com número CNJ conhecido e para medir judicialização por órgão.
