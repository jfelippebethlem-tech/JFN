# avisos_calados.yaml — os avisos de sistema que o silêncio de 17/11/2026 engolia (data/telegram_silenciado.jsonl),
# classe por classe, com a causa, o DESTINO que os vê hoje e o estado (plano mestre v2 §9 O8.4: "101 avisos calados
# fechados na origem"). Medido em 24/11/2026: 101 linhas até a redação do plano (23/11 21h48), 107 até 24/11 12h29.
#
#   estado  fechado    — o PRODUTOR deixou de montar o aviso; a informação vive no destino (fila única, E18, vault).
#                        Prova executável: `produtor` não contém mais `marcador` (ou contém `marcador_presente`) —
#                        tests/test_avisos_calados.py. Efeito: linha desta classe DEPOIS de `fechado_em` reabre o item
#                        `aviso:<id>` na automelhoria (o fechamento não pegou).
#           registrado — causa fora do alcance desta onda (outra frente, fora do repo ou decisão do dono): cada linha
#                        nova (7 dias) vira o item `aviso:<id>` da fila com a `acao_humana`.
#   Linha que não casa com nenhuma classe vira `aviso:sem-classe` — aviso calado sem dono não some.
# Casamento: `origem` igual à do log E `padrao` (regex) no começo do texto (`inicio`).
versao: 1
classes:
  automelhoria-novidades:
    origem: automelhoria
    padrao: '^🔁 Automelhoria:'
    n_ate_20261124: 44
    causa: resumo de novidades da própria automelhoria; o dono vetou aviso de sistema (17/11) e "Yoda só fala quando pedido" (22/11)
    destino: fila única (data/automelhoria_fila.json) + /melhorias + relatório diário no vault; ESCALADO segue pelo canal próprio (decisão 7)
    estado: fechado
    fechado_em: '2026-11-24 23:30'
    produtor: tools/automelhoria_geral.py
    marcador: 'origem="automelhoria"'
